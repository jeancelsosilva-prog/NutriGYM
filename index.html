      if(stepType==='qualidade') _formDraft.qualityFormat=_vacationSelectedFormat||QUALITY_FORMATS[0].id;
      navigate('#/registrar-corrida'); return;
    }
    case 'vacation-run-later': pushVacationRunObligation(); completeVacationStep({countsAsActiveDay:false}); _sheetType=null; toast('Corrida adiada — fica pendente na tela Hoje'); navigate('#/hoje'); return;
    case 'vacation-run-skip': completeVacationStep({countsAsActiveDay:false, stat:'runsSkipped'}); _sheetType=null; toast('Corrida pulada'); navigate('#/hoje'); return;
    case 'vacation-select-format': _vacationSelectedFormat=el.dataset.format; break;
    case 'vacation-pending-resolve': {
      const p=vacationPendingRun(); if(!p) return;
      ensureCorridaDraft();
      _formDraft.type=p.type; _formDraft.duration=p.minMin; _formDraft.qualityFormat=p.qualityFormat;
      _formDraft.programMode='vacation'; _formDraft.vacationBlockId=p.vacationBlockId; _formDraft.vacationStepKind=p.vacationStepKind;
      _formDraft.__resolvesPendingId=p.id;
      navigate('#/registrar-corrida'); return;
    }
    case 'vacation-pending-skip': { const p=vacationPendingRun(); if(p) p.status='pulada'; saveState(true); toast('Pendência removida'); break; }
    case 'vacation-end-confirm': _sheetType='vacation-end-confirm'; renderOverlay(); return;
    case 'vacation-end-do': {
      const wasActive=isVacationActive();
      if(wasActive){ _lastVacationReport=endVacation(null); _sheetType=null; navigate('#/ferias/relatorio'); return; }
      state.vacation=DEFAULT_VACATION_STATE(); saveState(true); _sheetType=null; toast('Agendamento cancelado'); navigate('#/hoje'); return;
    }
    case 'dismiss-return-protocol': state.vacation.returnProtocol=null; saveState(true); break;

    default: return;
  }
  render();
}

/* ============================================================
   GLOBAL LISTENERS + INIT
   ============================================================ */
function attachGlobalListeners(){
  document.addEventListener('click', function(e){
    const navEl=e.target.closest('[data-nav]');
    if(navEl){ e.preventDefault(); navigate(navEl.getAttribute('data-nav')); return; }
    const actEl=e.target.closest('[data-action]');
    if(actEl){ handleAction(actEl); return; }
    if(e.target && e.target.classList && e.target.classList.contains('overlay')){ closeSheet(); }
  });
  document.addEventListener('input', function(e){
    const t=e.target;
    if(t.id==='libSearch'){ _libQuery=t.value; const r=document.getElementById('libResults'); if(r) r.innerHTML=libResultsHTML(); return; }
    if(t.dataset && t.dataset.action==='approach-load'){ logApproachSet(t.dataset.key, {load:t.value?Number(t.value):null}); return; }
    if(t.dataset && t.dataset.action==='set-effort'){ if(state.activeSession){ state.activeSession.effort=Number(t.value); saveState(); } const dv=document.getElementById('effortVal'); if(dv) dv.textContent=t.value; return; }
    if(t.dataset && t.dataset.action==='set-notes'){ if(state.activeSession){ state.activeSession.notes=t.value; saveState(); } return; }
    if(t.dataset && t.dataset.field){
      const f=t.dataset.field;
      if(f.indexOf('exnote-')===0){ const exId=f.slice(7); state.exerciseNotes[exId]=t.value; saveState(); return; }
      if(_formDraft) _formDraft[f]=t.value;
      return;
    }
  });
  document.addEventListener('change', function(e){
    if(e.target && e.target.id==='importFileInput'){
      const file=e.target.files && e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=function(ev){
        try{
          const parsed=JSON.parse(ev.target.result);
          const importedVersion = parsed.version||1;
          if(importedVersion>CURRENT_VERSION){
            throw new Error('Backup da versão '+importedVersion+', superior à versão suportada '+CURRENT_VERSION+'.');
          }
          const migrated = importedVersion<CURRENT_VERSION ? migrateState(parsed) : parsed;
          _importPending = validateAndNormalizeImport(migrated);
          _sheetType='import-confirm';
          renderOverlay();
        }catch(err){
          console.error('Falha ao importar backup:', err);
          toast(err && err.message ? err.message : 'Arquivo inválido');
        }
      };
      reader.readAsText(file);
      e.target.value='';
    }
  });
}

/* ============================================================
   MODO FÉRIAS — flexible PPL + running queue, decoupled from the
   24x72 duty roster and from the 24x72 mesociclo (which is paused,
   not advanced, for the whole duration of the block).
   ============================================================ */
const VACATION_QUEUES = {
  normal:  ['ppl','ppl','zona2-longa','rest','ppl','rest','qualidade'],
  relaxed: ['ppl','ppl','zona2-longa','rest','ppl','rest','qualidade'],
  travel:  ['ppl','rest','ppl','rest','ppl','rest','rest'],
};
const VACATION_LEVEL_LABEL = {normal:'Normal', relaxed:'Relaxado', travel:'Viagem/ocupado'};
function isVacationActive(){ return !!(state.vacation && state.vacation.status==='active'); }
function isVacationScheduled(){ return !!(state.vacation && state.vacation.status==='scheduled'); }

function resolveVacationStep(kind){
  if(kind==='ppl'){
    const abstractPpl = state.vacation.currentPpl; // 'push' | 'pull' | 'legs'
    const workoutId = abstractPpl==='legs' ? (state.cycle.nextLegsVariant==='B'?'legsB':'legsA') : abstractPpl;
    return { kind:'ppl', workoutId, label: WORKOUTS[workoutId].label, color: WORKOUTS[workoutId].color };
  }
  if(kind==='zona2-longa') return { kind:'zona2-longa', label:'Zona 2 longa', minMin:35, maxMin:50, runType:'zona2' };
  if(kind==='qualidade') return { kind:'qualidade', label:'Corrida de qualidade', minMin:25, maxMin:35, runType:'qualidade' };
  return { kind:'rest', label:'Descanso' };
}
function recentlyCompletedLegsWithin(days){
  const last=lastWorkoutDate('legs');
  if(!last) return false;
  return isWithinLastDays(todayISO(new Date(last.startedAt)), days);
}
function getVacationTodayPlan(){
  const v=state.vacation;
  if(!v || v.status!=='active') return null;
  const today=todayISO();
  if(v.lastStepDate===today) return {kind:'done-today'};
  if(v.consecutiveActiveDays>=3) return {kind:'rest', forced:true, label:'Descanso (recomendado)'};
  const stepKind=v.queue[v.currentStepIndex % v.queue.length];
  const resolved=resolveVacationStep(stepKind);
  if(resolved.kind==='qualidade' && recentlyCompletedLegsWithin(1)) resolved.legsWarning=true;
  return resolved;
}
function vacationOffersZona2Curta(){
  return isVacationActive() && state.vacation.level==='normal';
}

function startVacationBlock(startDate, endDate, level, firstPpl){
  const lvl = VACATION_QUEUES[level] ? level : 'normal';
  state.vacation = Object.assign(DEFAULT_VACATION_STATE(), {
    status: startDate<=todayISO() ? 'active' : 'scheduled',
    startDate, endDate, level:lvl,
    blockId: uid('vac'),
    queue: VACATION_QUEUES[lvl].slice(),
    currentStepIndex: 0,
    currentPpl: firstPpl||'push',
    pausedNormalState: {
      trainingCycleNumber: state.cycle.trainingCycleNumber,
      mesocicloBase: state.cycle.mesocicloBase,
      nextLegsVariant: state.cycle.nextLegsVariant,
      anchorDate: state.cycle.anchorDate,
      anchorDayIndex: state.cycle.anchorDayIndex,
    },
  });
  // Archive (don't carry) normal-mode pending runs by default — vacation
  // starts with a clean aerobic slate rather than inherited debt.
  (state.pendingRuns||[]).forEach(p=>{ if(p.status==='adiada') p.status='pulada'; });
  saveState(true);
}
function completeVacationStep(opts){
  opts=opts||{};
  const v=state.vacation; if(!v) return;
  if(!opts.forced){
    if(opts.advancePpl){
      v.currentPpl = v.currentPpl==='push' ? 'pull' : v.currentPpl==='pull' ? 'legs' : 'push';
    }
    v.currentStepIndex = (v.currentStepIndex+1) % v.queue.length;
  }
  v.consecutiveActiveDays = opts.countsAsActiveDay ? (v.consecutiveActiveDays+1) : 0;
  v.lastStepDate = todayISO();
  if(opts.stat) v.stats[opts.stat] = (v.stats[opts.stat]||0)+1;
  saveState(true);
}
function pushVacationRunObligation(){
  const plan=getVacationTodayPlan(); if(!plan || (plan.kind!=='zona2-longa' && plan.kind!=='qualidade')) return;
  (state.pendingRuns||[]).forEach(p=>{ if(p.status==='adiada' && p.vacationBlockId===state.vacation.blockId) p.status='replaced'; });
  state.pendingRuns.push({
    id:uid('pending'), source:'vacation', vacationBlockId:state.vacation.blockId,
    type: plan.kind==='qualidade'?'qualidade':'zona2',
    qualityFormat: plan.kind==='qualidade' ? (_vacationSelectedFormat||QUALITY_FORMATS[0].id) : null,
    vacationStepKind: plan.kind==='qualidade'?'qualidade':'zona2longa',
    label:plan.label, minMin:plan.minMin, maxMin:plan.maxMin,
    createdAt:Date.now(), status:'adiada', runId:null,
  });
  saveState(true);
}
function buildVacationReport(){
  const v=state.vacation;
  const sessions = state.sessions.filter(s=>s.vacationBlockId===v.blockId);
  const runs = state.runs.filter(r=>r.vacationBlockId===v.blockId);
  return {
    startDate:v.startDate, endDate:v.endDate, level:v.level,
    pushN: sessions.filter(s=>s.workoutId==='push').length,
    pullN: sessions.filter(s=>s.workoutId==='pull').length,
    legsN: sessions.filter(s=>s.workoutId==='legsA'||s.workoutId==='legsB').length,
    zona2N: runs.filter(r=>r.type==='zona2').length,
    qualidadeN: runs.filter(r=>r.type==='qualidade').length,
    qualityFormats: runs.filter(r=>r.type==='qualidade' && r.qualityFormat).reduce((acc,r)=>{ acc[r.qualityFormat]=(acc[r.qualityFormat]||0)+1; return acc; },{}),
    restsCompleted: v.stats.restsCompleted,
    strengthSkipped: v.stats.strengthSkipped,
    runsSkipped: v.stats.runsSkipped,
    totalMinutes: runs.reduce((s,r)=>s+(r.durationMin||0),0),
    totalDistanceKm: Math.round(runs.reduce((s,r)=>s+(r.distanceKm||0),0)*10)/10,
  };
}
function endVacation(reanchor){
  const v=state.vacation;
  const report = buildVacationReport();
  if(reanchor && reanchor.situation){
    correctCycle(reanchor.situation, reanchor.nextShiftDate);
  }
  (state.pendingRuns||[]).forEach(p=>{ if(p.vacationBlockId===v.blockId && p.status==='adiada') p.status='pulada'; });
  const lastPush=lastWorkoutDate('push'), lastPull=lastWorkoutDate('pull'), lastLegs=lastWorkoutDate('legs');
  const daysSince = arr => Math.min.apply(null, arr.map(s=> s? daysBetween(todayISO(new Date(s.startedAt)),todayISO()) : 999));
  const gap = daysSince([lastPush,lastPull,lastLegs]);
  let returnProtocol=null;
  if(gap>=7) returnProtocol='reduced_7_plus_days';
  else if(gap>=4) returnProtocol='reduced_4_6_days';
  state.vacation = Object.assign(DEFAULT_VACATION_STATE(), {returnProtocol});
  saveState(true);
  return report;
}

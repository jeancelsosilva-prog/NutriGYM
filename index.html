<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Ficha PPL Híbrida</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#0b0d10;
  --bg-elev:#121519;
  --card:#181c21;
  --card-alt:#1f242b;
  --border:#262b32;
  --text:#f3f4f6;
  --text-dim:#9aa2ac;
  --text-faint:#7f8894;
  --accent:#29c4cf;
  --accent-strong:#1fa9b3;
  --accent-soft:rgba(41,196,207,.14);
  --push:#d1665c;
  --push-soft:rgba(209,102,92,.16);
  --pull:#4c82f0;
  --pull-soft:rgba(76,130,240,.16);
  --legs:#4bb883;
  --legs-soft:rgba(75,184,131,.16);
  --core:#a884e3;
  --core-soft:rgba(168,132,227,.16);
  --run:#f2a154;
  --run-soft:rgba(242,161,84,.16);
  --warn:#f0c94e;
  --warn-soft:rgba(240,201,78,.14);
  --danger:#ef4b4b;
  --danger-soft:rgba(239,75,75,.14);
  --ok:#4bb883;
  --idle:#5b6470;
  --idle-soft:rgba(91,100,112,.16);
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;
  --radius-xl:26px;
  --tap-min:48px;
  --shadow-card:0 6px 20px rgba(0,0,0,.28);
  --shadow-sheet:0 -8px 30px rgba(0,0,0,.4);
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Roboto Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
[data-theme="light"]{
  --bg:#f2f3f5;
  --bg-elev:#ffffff;
  --card:#ffffff;
  --card-alt:#eceef1;
  --border:#dde1e6;
  --text:#171a1d;
  --text-dim:#565e68;
  --text-faint:#5f6673;
  --shadow-card:0 6px 18px rgba(20,20,30,.08);
  --shadow-sheet:0 -8px 24px rgba(20,20,30,.14);
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;}
ul,ol{padding-left:1.1em;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
::selection{background:var(--accent-soft);}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
  background:var(--bg);
}
.screen{
  flex:1;
  padding:var(--sp-4) var(--sp-4) calc(96px + var(--safe-b));
  animation:fadeIn .22s ease both;
}
.screen.no-bottom-pad{padding-bottom:calc(var(--sp-6) + var(--safe-b));}
/* Screens with no .topbar child (onboarding) still need their own top clearance;
   .topbar carries its own safe-t below for screens that do have one, so this
   is applied only where nothing else already accounts for the notch. */
.screen.no-topbar{padding-top:calc(var(--sp-4) + var(--safe-t));}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* Top header */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bg) 70%, transparent);
  padding:calc(var(--sp-3) + var(--safe-t)) var(--sp-4) var(--sp-2);
  display:flex;align-items:center;justify-content:space-between;
  max-width:520px;margin:0 auto;width:100%;
}
.topbar .greet{font-size:13px;color:var(--text-faint);letter-spacing:.02em;text-transform:uppercase;font-weight:600;}
.topbar .daylabel{font-size:20px;font-weight:700;margin-top:2px;}
.icon-btn{
  width:var(--tap-min);height:var(--tap-min);
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:50%;color:var(--text-dim);
  transition:background .15s ease, color .15s ease;
}
.icon-btn:active{background:var(--card-alt);color:var(--text);}
.icon-btn svg{width:22px;height:22px;}

/* Base sizing for every icon() output — without this, bare inline <svg> can
   render at the browser's default 300x150 box wherever icon() is used outside
   .icon-btn/.nav-item (buttons, banners, table cells, timer controls). */
.ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;line-height:0;vertical-align:middle;}
.ic svg{width:1.15em;height:1.15em;display:block;}

/* Bottom nav */
.nav-bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
}
.nav-bottom-inner{
  width:100%;max-width:520px;
  display:flex;background:var(--bg-elev);
  border-top:1px solid var(--border);
  padding:6px 4px calc(6px + var(--safe-b));
  box-shadow:0 -2px 16px rgba(0,0,0,.25);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-faint);
  padding:6px 2px;border-radius:var(--radius-s);
  font-size:11px;font-weight:600;letter-spacing:.01em;
}
.nav-item svg{width:22px;height:22px;}
.nav-item.active{color:var(--accent);}
.nav-item:active{background:var(--card-alt);}

/* session control bar (replaces bottom nav during active workout) */
.nav-session{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
}
.nav-session-inner{
  width:100%;max-width:520px;display:flex;gap:8px;align-items:center;
  background:var(--bg-elev);border-top:1px solid var(--border);
  padding:10px var(--sp-3) calc(10px + var(--safe-b));
  box-shadow:0 -2px 16px rgba(0,0,0,.25);
}
.nav-session-inner .btn{flex:1;}
.nav-session-inner .btn.icon-only{flex:0 0 var(--tap-min);}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  min-height:var(--tap-min);
  padding:0 18px;
  border-radius:var(--radius-m);
  border:1px solid transparent;
  background:var(--card-alt);
  color:var(--text);
  font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-block{width:100%;}
.btn-primary{background:var(--accent);color:#04262a;}
.btn-primary:active{background:var(--accent-strong);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
.btn-ghost{background:transparent;color:var(--text-dim);padding:0 10px;min-height:40px;}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:var(--radius-s);}
.btn-lg{min-height:56px;font-size:16.5px;border-radius:var(--radius-l);}
.btn:disabled{opacity:.4;pointer-events:none;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

.fab-primary{
  min-height:58px;font-size:17px;font-weight:700;
  background:var(--accent);color:#04262a;border-radius:var(--radius-l);
  box-shadow:0 8px 22px rgba(41,196,207,.25);
}

/* Segmented control */
.segmented{
  display:flex;background:var(--card-alt);border-radius:var(--radius-m);padding:3px;gap:2px;
}
.segmented button{
  flex:1;border:none;background:transparent;color:var(--text-dim);
  min-height:40px;border-radius:calc(var(--radius-m) - 3px);font-weight:600;font-size:13.5px;
  transition:background .15s ease,color .15s ease;
}
.segmented button.active{background:var(--bg-elev);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3);}

/* Chips / badges */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--card-alt);color:var(--text-dim);
}
.chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.tag-push{background:var(--push-soft);color:var(--push);}
.tag-pull{background:var(--pull-soft);color:var(--pull);}
.tag-legs{background:var(--legs-soft);color:var(--legs);}
.tag-core{background:var(--core-soft);color:var(--core);}
.tag-run{background:var(--run-soft);color:var(--run);}
.tag-idle{background:var(--idle-soft);color:var(--idle);}
.tag-warn{background:var(--warn-soft);color:var(--warn);}
.tag-danger{background:var(--danger-soft);color:var(--danger);}

/* ============================================================
   CARDS / SURFACES
   ============================================================ */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-l);
  padding:var(--sp-5);
  box-shadow:var(--shadow-card);
}
.card + .card{margin-top:var(--sp-4);}
.card-title{font-size:19px;font-weight:700;letter-spacing:-.01em;}
.card-sub{font-size:13.5px;color:var(--text-dim);margin-top:2px;}
.stack{display:flex;flex-direction:column;gap:var(--sp-4);}
.stack-sm{display:flex;flex-direction:column;gap:var(--sp-2);}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);}
.row-start{display:flex;align-items:center;gap:var(--sp-2);}
.divider{height:1px;background:var(--border);margin:var(--sp-4) 0;border:none;}
.section-label{
  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
  margin-bottom:var(--sp-2);
}
.empty-state{
  text-align:center;padding:var(--sp-8) var(--sp-4);color:var(--text-dim);
}
.empty-state .ico{font-size:34px;margin-bottom:var(--sp-2);opacity:.7;}

/* Duty strip — signature cycle indicator */
.duty-strip{display:flex;gap:6px;}
.duty-seg{
  flex:1;height:34px;border-radius:9px;background:var(--card-alt);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-faint);
  border:1px solid var(--border);position:relative;overflow:hidden;
}
.duty-seg.now{color:#04141a;border-color:transparent;}
.duty-seg.now.d-idle{background:var(--idle);color:#0c0f12;}
.duty-seg.now.d-push{background:var(--push);}
.duty-seg.now.d-legs{background:var(--legs);}
.duty-seg.now.d-pull{background:var(--pull);}
.duty-seg.past{opacity:.45;}

/* Load / numeric readouts */
.load-number{font-family:var(--font-mono);font-size:26px;font-weight:700;letter-spacing:-.02em;}
.timer-display{font-family:var(--font-mono);font-size:44px;font-weight:700;letter-spacing:-.01em;text-align:center;}
.timer-display.pulse{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

/* Progress bar */
.progress-track{height:6px;border-radius:99px;background:var(--card-alt);overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}

/* ============================================================
   FORMS
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:600;color:var(--text-dim);}
.input,.textarea,select.input{
  width:100%;background:var(--card-alt);border:1px solid var(--border);
  border-radius:var(--radius-m);padding:12px 14px;min-height:var(--tap-min);color:var(--text);
}
.textarea{min-height:88px;resize:vertical;}
.input:focus,.textarea:focus,select.input:focus{outline:2px solid var(--accent);outline-offset:1px;}

.stepper{display:flex;align-items:center;gap:10px;}
.stepper button{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--card-alt);font-size:20px;font-weight:700;color:var(--text);
  display:flex;align-items:center;justify-content:center;
}
.stepper button:active{background:var(--bg-elev);}
.stepper .val{flex:1;text-align:center;font-family:var(--font-mono);font-size:24px;font-weight:700;}
.stepper .unit{font-size:13px;color:var(--text-faint);margin-left:4px;}

.pill-select{display:flex;gap:8px;flex-wrap:wrap;}
.pill-select button{
  border:1px solid var(--border);background:var(--card-alt);color:var(--text-dim);
  padding:9px 14px;border-radius:999px;font-weight:600;font-size:13.5px;min-height:40px;
}
.pill-select button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.opt-list{display:flex;flex-direction:column;gap:8px;}
.opt-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px;border:1px solid var(--border);border-radius:var(--radius-m);background:var(--card-alt);
  min-height:var(--tap-min);
}

/* toggle switch */
.switch{position:relative;width:46px;height:27px;flex-shrink:0;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.switch .track{position:absolute;inset:0;background:var(--card-alt);border:1px solid var(--border);border-radius:99px;transition:background .15s;}
.switch .thumb{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--text-faint);transition:transform .15s,background .15s;}
.switch input:checked + .track{background:var(--accent-soft);border-color:var(--accent);}
.switch input:checked + .track .thumb{transform:translateX(19px);background:var(--accent);}

/* ============================================================
   TABLE (sets)
   ============================================================ */
.set-table{width:100%;border-collapse:collapse;font-size:14px;}
.set-table th{
  text-align:left;color:var(--text-faint);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.04em;padding:0 6px 6px;
}
.set-table td{padding:9px 6px;border-top:1px solid var(--border);font-family:var(--font-mono);}
.set-table tr.current td{font-family:var(--font-sans);color:var(--text-faint);font-style:italic;}
.set-table td.check{font-family:var(--font-sans);color:var(--ok);text-align:center;}

/* ============================================================
   SHEET / OVERLAY
   ============================================================ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .15s ease both;
}
.sheet{
  width:100%;max-width:520px;background:var(--bg-elev);
  border-radius:22px 22px 0 0;padding:var(--sp-3) var(--sp-4) calc(var(--sp-5) + var(--safe-b));
  box-shadow:var(--shadow-sheet);
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1) both;
  max-height:88vh;overflow-y:auto;
}
.sheet-grab{width:36px;height:4px;background:var(--border);border-radius:99px;margin:2px auto 14px;}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:var(--sp-4);}

/* ============================================================
   TABS
   ============================================================ */
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:var(--sp-4);}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:none;border:none;background:transparent;color:var(--text-faint);font-weight:600;font-size:14px;
  padding:8px 4px;border-bottom:2px solid transparent;min-height:40px;margin-right:18px;
}
.tab-btn.active{color:var(--text);border-color:var(--accent);}

/* ============================================================
   MISC
   ============================================================ */
.exercise-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius-l);
  padding:var(--sp-4);
}
.media-placeholder{
  display:flex;gap:8px;
}
.media-slot{
  flex:1;aspect-ratio:4/3;border-radius:var(--radius-m);background:var(--card-alt);
  border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:var(--text-faint);font-size:11.5px;text-align:center;padding:8px;
}
.media-slot .ic svg{width:24px;height:24px;}

.cue-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.cue-list li{display:flex;gap:8px;font-size:14px;color:var(--text-dim);}
.cue-list li::before{content:"›";color:var(--accent);font-weight:700;}

.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);
  background:var(--bg-elev);border:1px solid var(--border);color:var(--text);
  padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:60;
  display:flex;align-items:center;gap:10px;
  animation:toastIn .25s ease both;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.banner{
  border-radius:var(--radius-m);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;
}
.banner-warn{background:var(--warn-soft);color:var(--warn);}
.banner-info{background:var(--accent-soft);color:var(--accent);}
.banner-danger{background:var(--danger-soft);color:var(--danger);}

.readonly-note{font-size:13px;color:var(--text-faint);line-height:1.5;}

svg.chart{width:100%;height:auto;display:block;}
.chart-grid line{stroke:var(--border);stroke-width:1;}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.chart-dot{fill:var(--accent);}
.chart-milestone{stroke:var(--warn);stroke-dasharray:3 4;stroke-width:1.5;}

.link-btn{background:none;border:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;}

.kbd-hint{font-size:11px;color:var(--text-faint);}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
.stat-box{background:var(--card-alt);border-radius:var(--radius-m);padding:12px 14px;}
.stat-box .num{font-family:var(--font-mono);font-size:20px;font-weight:700;}
.stat-box .lbl{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>
<div id="toast-root"></div>
<script>
'use strict';
/* ==================================================================
   FICHA PPL HÍBRIDA — app.js (embedded)
   Single-file SPA. Hash router. localStorage persistence.
   ================================================================== */

/* ============================================================
   ICONS (inline SVG strings, stroke=currentColor)
   ============================================================ */
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M3 8l3-3M18 21l3-3M2 9l2-2M20 17l2-2"/><path d="M8 4l2 2M14 18l2 2"/><rect x="5" y="5" width="4" height="4" rx="1" transform="rotate(45 7 7)"/><rect x="15" y="15" width="4" height="4" rx="1" transform="rotate(45 17 17)"/></svg>',

function todayISO(d){ d=d||new Date(); const tz=d.getTimezoneOffset()*60000; return new Date(d-tz).toISOString().slice(0,10); }
function nowStamp(){ return Date.now(); }
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function daysBetween(dateA,dateB){ const a=new Date(dateA+'T00:00:00'); const b=new Date(dateB+'T00:00:00'); return Math.round((b-a)/86400000); }
function isWithinLastDays(dateStr, n){
  const diff = daysBetween(dateStr, todayISO());

}
function fmtDateShort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
function fmtDateFull(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtMMSS(totalSec){ totalSec=Math.max(0,Math.round(totalSec)); const m=Math.floor(totalSec/60); const s=totalSec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function fmtMin(ms){ return Math.round(ms/60000); }
function fmtHM(ms){ const totalMin=Math.round(ms/60000); const h=Math.floor(totalMin/60); const m=totalMin%60; return h>0? (h+'h '+m+'min') : (m+' min'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let _audioCtx=null;
function beep(freq,durMs){
  try{
    if(!state.settings.sound) return;
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const osc=_audioCtx.createOscillator(); const gain=_audioCtx.createGain();
    osc.frequency.value=freq||880; osc.type='sine';
    gain.gain.setValueAtTime(0.0001,_audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18,_audioCtx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,_audioCtx.currentTime+(durMs||220)/1000);
    osc.connect(gain); gain.connect(_audioCtx.destination);
    osc.start(); osc.stop(_audioCtx.currentTime+(durMs||220)/1000+0.02);
  }catch(e){}
}
function toast(msg, opts){
  opts=opts||{};
  const root=document.getElementById('toast-root');
  const el=document.createElement('div'); el.className='toast'; el.innerHTML=escapeHtml(msg);
  root.innerHTML=''; root.appendChild(el);
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, opts.duration||2200);
}

function weightedIncrement(exId){
  const ex=EX[exId]||{};
  if(ex.incrementCategory==='lower') return state.settings.incrementLower;
  if(ex.incrementCategory==='upperMachine') return state.settings.incrementUpperMachine;
  if(ex.incrementCategory==='isolator') return state.settings.incrementIsolator;
  if(ex.incrementCategory==='core') return state.settings.incrementCore;
  return state.settings.incrementUpper;
}
function roundToIncrement(value, increment){

let state = null;

function normalizeQualityRunShape(r){
  // Older data used type:'intervalado' as its own type. The definitive model
  // is type:'qualidade' + qualityFormat:'intervalado'|'tempo'|'fartlek', so
  // format breakdowns don't have to treat two different fields as one concept.
  if(r && r.type==='intervalado'){
    r.type='qualidade';
    r.qualityFormat = r.qualityFormat || 'intervalado';
  }
  return r;
}
function migrateState(parsed){
  // v1 -> v2: cycleNumber/mesociclo became completion-driven (trainingCycleNumber)
  // instead of calendar-derived; pendingRuns and the 5-way increment split were
  // introduced. New fields already get sane defaults via DEFAULT_STATE merging —
  // the only value that would otherwise be silently lost is the old calendar-
  // derived cycleNumber, carried forward here so in-progress mesociclo position
  // isn't reset to 1 on upgrade.
  let data = parsed;
  const fromVersion = data.version || 1;
  if(fromVersion < 2 && data.cycle && data.cycle.trainingCycleNumber==null && data.cycle.cycleNumber!=null){
    data = Object.assign({}, data, { cycle: Object.assign({}, data.cycle, { trainingCycleNumber: data.cycle.cycleNumber }) });
  }
  // v2 -> v3: Modo Férias introduced. Existing sessions/runs are tagged
  // programMode:'normal' (nothing about their behavior changes), and the old
  // standalone 'intervalado' run type collapses into qualidade+qualityFormat.
  if(fromVersion < 3){
    data = Object.assign({}, data);
    data.vacation = data.vacation ? Object.assign(DEFAULT_VACATION_STATE(), data.vacation) : DEFAULT_VACATION_STATE();
    data.sessions = (data.sessions||[]).map(s=> Object.assign({programMode:'normal'}, s));
    data.runs = (data.runs||[]).map(r=> normalizeQualityRunShape(Object.assign({programMode:'normal', qualityFormat:null}, r)));
    data.pendingRuns = (data.pendingRuns||[]).map(p=> normalizeQualityRunShape(Object.assign({programMode:'normal'}, p)));
  }
  data.version = CURRENT_VERSION;
  return data;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ state = DEFAULT_STATE(); return; }
    let parsed = JSON.parse(raw);
    let migrated=false;
    if((parsed.version||1) < CURRENT_VERSION){ parsed = migrateState(parsed); migrated=true; }
    state = Object.assign(DEFAULT_STATE(), parsed);
    state.settings = Object.assign(DEFAULT_STATE().settings, parsed.settings||{});
    state.cycle = Object.assign(DEFAULT_STATE().cycle, parsed.cycle||{});
    state.vacation = Object.assign(DEFAULT_VACATION_STATE(), parsed.vacation||{});
    if(migrated) saveState(true);
  }catch(e){
    console.error('Falha ao carregar dados salvos, iniciando estado novo.', e);
    state = DEFAULT_STATE();
  }
}
let _saveTimer=null;
function saveState(immediate){
  const doSave=()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('Erro ao salvar', e); toast('Não foi possível salvar (armazenamento cheio?)'); }
  };
  if(immediate){ doSave(); return; }
  clearTimeout(_saveTimer); _saveTimer=setTimeout(doSave, 60);
}

function summarizeImport(obj){

    sessions: (obj.sessions||[]).length,

// Defensive shape-check so a malformed/foreign JSON file can't corrupt state.
// Not a full migration framework (nothing to migrate from yet at version 1),
// but gives future version bumps a single place to grow real transformations.
function validateAndNormalizeImport(data){
  if(!data || typeof data!=='object') throw new Error('Arquivo não é um backup válido.');
  return {
    version: typeof data.version==='number' ? data.version : 1,
    onboarded: typeof data.onboarded==='boolean' ? data.onboarded : true,
    sessions: Array.isArray(data.sessions) ? data.sessions.filter(s=>s && typeof s.startedAt==='number' && Array.isArray(s.exercises)) : [],
    measurements: Array.isArray(data.measurements) ? data.measurements.filter(m=>m && typeof m.date==='string') : [],
    runs: Array.isArray(data.runs) ? data.runs.filter(r=>r && typeof r.date==='string') : [],
    recoveryLogs: Array.isArray(data.recoveryLogs) ? data.recoveryLogs.filter(r=>r && typeof r.date==='string') : [],
    pendingRuns: Array.isArray(data.pendingRuns) ? data.pendingRuns.filter(r=>r && typeof r.cycleNumber==='number') : [],
    exerciseNotes: (data.exerciseNotes && typeof data.exerciseNotes==='object') ? data.exerciseNotes : {},
    substitutionPrefs: (data.substitutionPrefs && typeof data.substitutionPrefs==='object') ? data.substitutionPrefs : {},
    settings: (data.settings && typeof data.settings==='object') ? data.settings : undefined,
    cycle: (data.cycle && typeof data.cycle==='object') ? data.cycle : undefined,
    vacation: (data.vacation && typeof data.vacation==='object') ? data.vacation : undefined,
    lastBackupAt: data.lastBackupAt||null,
  };
}
function importBackup(obj, mode){
  if(mode==='substituir'){
    state = Object.assign(DEFAULT_STATE(), obj);
    if(obj.settings) state.settings=Object.assign(DEFAULT_STATE().settings, obj.settings);
    if(obj.cycle) state.cycle=Object.assign(DEFAULT_STATE().cycle, obj.cycle);
    state.vacation = obj.vacation ? Object.assign(DEFAULT_VACATION_STATE(), obj.vacation) : DEFAULT_VACATION_STATE();
  } else {
    const existingIds = new Set(state.sessions.map(s=>s.id));
    (obj.sessions||[]).forEach(s=>{ if(!existingIds.has(s.id)) state.sessions.push(s); });
    const existingMeas = new Set(state.measurements.map(m=>m.id));
    (obj.measurements||[]).forEach(m=>{ if(!existingMeas.has(m.id)) state.measurements.push(m); });
    const existingRuns = new Set(state.runs.map(r=>r.id));
    (obj.runs||[]).forEach(r=>{ if(!existingRuns.has(r.id)) state.runs.push(r); });
    const existingRecovery = new Set((state.recoveryLogs||[]).map(r=>r.id));
    (obj.recoveryLogs||[]).forEach(r=>{ if(!existingRecovery.has(r.id)) state.recoveryLogs.push(r); });
    const existingPending = new Set((state.pendingRuns||[]).map(r=>r.id));
    (obj.pendingRuns||[]).forEach(r=>{ if(!existingPending.has(r.id)) state.pendingRuns.push(r); });
    state.exerciseNotes = Object.assign({}, obj.exerciseNotes||{}, state.exerciseNotes);
    state.substitutionPrefs = Object.assign({}, obj.substitutionPrefs||{}, state.substitutionPrefs);
  }
  // Sessions may now be out of chronological order (merge appends at the end
  // regardless of date). Keep the array sorted so anything that scans "most
  // recent first" stays correct even without relying on it.
  state.sessions.sort((a,b)=>a.startedAt-b.startedAt);
  // Never trust an imported records blob directly — always rebuild bests from
  // the sessions themselves, only preserving forward-looking suggestions.
  recomputeAllRecords();
  state.version = CURRENT_VERSION;
  saveState(true);
}
function recomputeAllRecords(){
  const preserved={};
  Object.keys(state.records||{}).forEach(exId=>{
    const r=state.records[exId];
    preserved[exId]={ nextSuggestedLoad:r.nextSuggestedLoad, nextSuggestedReps:r.nextSuggestedReps, nextSuggestedDuration:r.nextSuggestedDuration };
  });
  state.records={};
  const sorted=[...state.sessions].sort((a,b)=>a.startedAt-b.startedAt);
  sorted.forEach(s=>updateRecordsFromSession(s));
  Object.keys(preserved).forEach(exId=>{
    state.records[exId]=state.records[exId]||{};
    Object.assign(state.records[exId], preserved[exId]);
  });
}

/* ============================================================
   CYCLE ENGINE — ciclo 24x72 contínuo
   ============================================================
   Two independent mechanisms, on purpose:
   - dayIndex (1-4): the real-world duty roster. Purely calendar-driven,
     correctable at any time via "Corrigir ciclo".
   - trainingCycleNumber / mesociclo (1-10 phase progress): advances only
     when a Pull session is actually finished, so a trip, illness, or a
     stretch of missed workouts pauses the mesociclo instead of silently
     fast-forwarding it into deload/reavaliação by calendar alone.
   ============================================================ */
function getCycleInfo(dateStr){
  dateStr = dateStr || todayISO();
  const c = state.cycle;
  const diff = daysBetween(c.anchorDate, dateStr);
  const absDayIndex0 = (c.anchorDayIndex-1) + diff;
  const dayIndex = ((absDayIndex0 % 4)+4)%4 + 1;
  const cycleNumber = c.trainingCycleNumber;
  const mesociclo = c.mesocicloBase;
  const phase = cycleNumber<=2 ? 'adaptacao' : cycleNumber<=8 ? 'desenvolvimento' : cycleNumber===9 ? 'deload' : 'reavaliacao';
  const dayMeta = CYCLE_DAYS[dayIndex];
  return { dayIndex, cycleNumber, mesociclo, phase, key:dayMeta.key, label:dayMeta.label, short:dayMeta.short, workout:dayMeta.workout, css:dayMeta.css };
}
function getTodayWorkoutId(info){
  info = info || getCycleInfo();
  if(info.workout==='legs') return state.cycle.nextLegsVariant==='B' ? 'legsB' : 'legsA';
  return info.workout;
}
/* ============================================================
   RUNNING ENGINE — 3 corridas a cada 2 ciclos (8 dias)
   Ciclo "A" (cycleNumber ímpar): 1 corrida de qualidade, no dia do Pull.
   Ciclo "B" (cycleNumber par): Zona 2 curta no dia do Push + Zona 2 longa
   no dia do Pull. Durante deload, a qualidade é sempre substituída por
   Zona 2 fácil (nunca intervalado/qualidade em semana de deload).
   ============================================================ */
const QUALITY_FORMATS = [
  {id:'intervalado', name:'Intervalado', desc:'6 × 1 minuto forte / 2 minutos leves entre estímulos'},
  {id:'tempo', name:'Tempo controlado', desc:'10–15 minutos moderadamente fortes dentro da sessão'},
  {id:'fartlek', name:'Fartlek', desc:'6 estímulos de 45–90 segundos, distribuídos livremente'},
];
function getPlannedRun(info){
  if(!info) return null;
  const isCycleA = (info.cycleNumber % 2) === 1;
  if(info.phase==='deload'){
    if(info.dayIndex===4) return {type:'zona2', label:'Zona 2 (deload)', minMin:20, maxMin:30};
    return null;
  }
  if(isCycleA){
    if(info.dayIndex===4) return {type:'qualidade', label:'Corrida de qualidade', minMin:25, maxMin:35};
    return null;
  }
  if(info.dayIndex===2) return {type:'zona2', label:'Zona 2 curta', minMin:25, maxMin:35};
  if(info.dayIndex===4) return {type:'zona2', label:'Zona 2 longa', minMin:35, maxMin:45};
  return null;
}
function pushRunObligation(status){
  const s=state.activeSession; if(!s) return;
  const planned=getPlannedRun(s.cycleSnapshot);
  if(!planned) return;
  const snap=s.cycleSnapshot;
  const duplicate = (state.pendingRuns||[]).some(p=>
    p.status==='adiada' && p.cycleNumber===snap.cycleNumber && p.mesociclo===snap.mesociclo &&
    p.dayIndex===snap.dayIndex && p.type===planned.type
  );
  if(duplicate) return;
  state.pendingRuns.push({id:uid('pending'), cycleNumber:snap.cycleNumber, mesociclo:snap.mesociclo, dayIndex:snap.dayIndex, type:planned.type, label:planned.label, minMin:planned.minMin, maxMin:planned.maxMin, qualityFormat: planned.type==='qualidade' ? (s.selectedQualityFormat||QUALITY_FORMATS[0].id) : null, createdAt:Date.now(), status, runId:null});
}
function aerobicRunMinutesLast8Days(){
  return state.runs.filter(r=>isWithinLastDays(r.date,8)).reduce((sum,r)=>sum+(r.durationMin||0),0);
}
function correctCycle(situation, nextShiftDate){
  // Only touches the duty-roster anchor. Training-block progress
  // (trainingCycleNumber/mesociclo) is a separate mechanism and is
  // intentionally left untouched by a roster correction.
  const map = {'plantao':1,'pos-plantao':2,'folga-plena':3,'ultima-folga':4};
  let idx;
  if(situation==='proximo-plantao' && nextShiftDate){
    const days = daysBetween(todayISO(), nextShiftDate);
    idx = (((1 - days - 1) % 4) + 4) % 4 + 1;
  } else {
    idx = map[situation] || 1;
  }
  state.cycle.anchorDate = todayISO();
  state.cycle.anchorDayIndex = idx;
  saveState(true);
}
function advanceTrainingCycle(){
  state.cycle.trainingCycleNumber += 1;
  if(state.cycle.trainingCycleNumber > 10){ state.cycle.trainingCycleNumber = 1; state.cycle.mesocicloBase += 1; }
  saveState(true);
}
function lastWorkoutDate(workoutFilter){
  // workoutFilter: 'push' | 'pull' | 'legs' (either variant) | exact id
  let best=null;
  for(const s of state.sessions){
    const match = workoutFilter==='legs' ? (s.workoutId==='legsA'||s.workoutId==='legsB') : s.workoutId===workoutFilter;
    if(match && (!best || s.startedAt>best.startedAt)) best=s;
  }
  return best;
}

/* ============================================================
   PROGRESSION ENGINE
   ============================================================ */
function evaluateProgression(exId, prescription, loggedSets, ctx){
  ctx = ctx||{};
  const ex = EX[exId]||{};
  if(ex.logType && ex.logType!=='strength') return evaluateCoreProgression(exId, prescription, loggedSets, ctx);
  const working = (loggedSets||[]).filter(s=>!s.isExtra);
  if(ctx.wasSubstituted) return {type:'suspensa', reason:'Exercício substituído nesta sessão.'};
  if(ctx.mode==='reduzido') return {type:'suspensa', reason:'Modo reduzido ativo — sem foco em progressão hoje.'};
  if(ctx.phase==='deload') return {type:'suspensa', reason:'Ciclo de deload — sem progressão nesta semana.'};
  if(!working.length) return null;
  const badDiscomfort = working.some(s=>s.discomfort==='articular' || s.discomfort==='incomum');
  if(badDiscomfort) return {type:'suspensa', reason:'Desconforto articular ou incomum registrado — priorize avaliar antes de progredir.'};
  const anyBadTech = working.some(s=>s.technique==='ruim');
  const anyBelowRange = prescription.repMin!=null && working.some(s=>typeof s.reps==='number' && s.reps < prescription.repMin);
  if(anyBadTech || anyBelowRange){
    return {type:'reduzir', reason: anyBadTech? 'Técnica comprometida em pelo menos uma série.' : 'Repetições abaixo da faixa prescrita.'};
  }
  const allAtTop = prescription.repMax!=null && working.every(s=>typeof s.reps==='number' && s.reps >= prescription.repMax);
  if(allAtTop){
    const rirFloor = prescription.rirMin!=null ? prescription.rirMin : 0;
    const rirOk = working.every(s=> s.rir==null || s.rir >= rirFloor);
    if(!rirOk){
      return {type:'manter', reason:'Repetições no topo da faixa, mas o RIR ficou abaixo do previsto — mantenha a carga e consolide o RIR alvo antes de progredir.'};
    }
    // Double progression applies the same way to isolators as to compostos:
    // once the top of the rep range is reached with good technique/RIR, the
    // move is to add the smallest available load and drop back to the
    // bottom of the range next time — not to keep stacking reps indefinitely
    // past the prescribed ceiling (12-20 becoming 21, 22...).
    const amount = weightedIncrement(exId);
    return {type:'aumentar-carga', reason:'Todas as séries no topo da faixa com boa técnica e RIR adequado.', amount};
  }
  return {type:'manter', reason:'Ainda não atingiu o topo da faixa em todas as séries.'};
}
function evaluateCoreProgression(exId, prescription, loggedSets, ctx){
  ctx=ctx||{};
  const ex=EX[exId]||{};
  const working=(loggedSets||[]).filter(s=>!s.isExtra);
  if(ctx.wasSubstituted) return {type:'suspensa', reason:'Exercício substituído nesta sessão.'};
  if(ctx.mode==='reduzido') return {type:'suspensa', reason:'Modo reduzido ativo — sem foco em progressão hoje.'};
  if(ctx.phase==='deload') return {type:'suspensa', reason:'Ciclo de deload — sem progressão nesta semana.'};
  if(!working.length) return null;
  const badDiscomfort=working.some(s=>s.discomfort==='articular'||s.discomfort==='incomum');
  if(badDiscomfort) return {type:'suspensa', reason:'Desconforto registrado — priorize avaliar antes de progredir.'};
  const anyBadControl=working.some(s=>s.control==='ruim');
  const anyDoming=working.some(s=>s.doming==='evidente');
  if(anyBadControl || anyDoming){
    return {type:'manter', reason: anyDoming? 'Abaulamento evidente registrado — reduza a amplitude e priorize o controle antes de progredir.' : 'Controle comprometido em pelo menos uma série — consolide a execução antes de progredir.'};
  }
  const anyLeveDoming=working.some(s=>s.doming==='leve');
  if(ex.logType==='plank'){
    const allAtTop=prescription.durMax!=null && working.every(s=>typeof s.durationSec==='number' && s.durationSec>=prescription.durMax);
    if(allAtTop && !anyLeveDoming) return {type:'aumentar-tempo', reason:'Boa respiração e alinhamento, sem abaulamento — acrescente cerca de 5 segundos.'};
    if(allAtTop && anyLeveDoming) return {type:'manter', reason:'Tempo-alvo atingido, mas houve abaulamento leve — consolide o controle antes de aumentar o tempo.'};
    return {type:'manter', reason:'Ainda não atingiu o tempo-alvo em todas as séries.'};
  }
  if(ex.logType==='carry'){
    const allAtTop=prescription.distMax!=null && working.every(s=>typeof s.distance==='number' && s.distance>=prescription.distMax);
    if(allAtTop && !anyLeveDoming) return {type:'aumentar-carga', reason:'Controle bom e distância-alvo atingida — aumente o menor incremento possível.', amount:weightedIncrement(exId)};
    return {type:'manter', reason:'Ainda não atingiu a distância-alvo com controle bom em todas as séries.'};
  }
  // core-reps: dead-bug, bird-dog, pallof-press
  const allAtTop=prescription.repMax!=null && working.every(s=>typeof s.reps==='number' && s.reps>=prescription.repMax);
  if(allAtTop && anyLeveDoming) return {type:'manter', reason:'Repetições-alvo atingidas, mas houve abaulamento leve — consolide o controle antes de progredir.'};
  if(allAtTop && !anyLeveDoming){
    if(exId==='pallof-press') return {type:'aumentar-carga', reason:'Controle bom, sem abaulamento, repetições no alvo — aumente o menor incremento possível.', amount:weightedIncrement(exId)};
    // Dead bug / bird dog don't have a meaningful "keep adding reps forever"
    // progression — once the rep range is mastered, the real progression is
    // qualitative: more amplitude, a brief pause at the hardest point, a
    // longer lever, or a harder variant. Not a number to bump each session.
    return {type:'aumentar-dificuldade', reason:'Bom controle e sem abaulamento — em vez de somar repetições, aumente a dificuldade: mais amplitude, uma pausa no ponto mais exigente, alavanca mais longa (braço/perna mais estendidos) ou uma variante mais avançada.'};
  }
  return {type:'manter', reason:'Priorize controle e amplitude antes de aumentar a dificuldade.'};
}
const PROG_LABEL = {
  manter:{label:'Manter', cls:'tag-idle'},
  'aumentar-carga':{label:'Aumentar carga', cls:'tag-legs'},
  'aumentar-reps':{label:'Aumentar repetições', cls:'tag-legs'},
  'aumentar-tempo':{label:'Aumentar tempo', cls:'tag-legs'},
  'aumentar-distancia':{label:'Aumentar distância', cls:'tag-legs'},
  'aumentar-dificuldade':{label:'Aumentar dificuldade', cls:'tag-legs'},
  reduzir:{label:'Reduzir carga', cls:'tag-warn'},
  suspensa:{label:'Progressão suspensa', cls:'tag-idle'},
};

/* ============================================================
   RECORDS / HISTORY LOOKUPS
   ============================================================ */
function findLastSessionExercise(exId, opts){
  opts=opts||{};
  let best=null;
  for(const s of state.sessions){
    if(opts.skipDeload && s.cycleNumber===9) continue;
    const e=s.exercises.find(x=>x.exId===exId);
    if(e && e.sets && e.sets.length){
      if(!best || s.startedAt>best.session.startedAt) best={session:s, entry:e};
    }
  }
  return best;
}
function findLastNonDeloadSessionExercise(exId){
  return findLastSessionExercise(exId, {skipDeload:true});
}
function topSet(sets){
  if(!sets||!sets.length) return null;
  return sets.reduce((best,s)=>{
    const load = typeof s.load==='number'? s.load:0;
    const bestLoad = best && typeof best.load==='number'? best.load:-1;
    return load>bestLoad ? s : best;
  }, null);
}
function updateRecordsFromSession(session){
  session.exercises.forEach(e=>{
    if(!e.sets || !e.sets.length) return;
    const t = topSet(e.sets);
    if(!t || typeof t.load!=='number') return;
    const rec = state.records[e.exId] || {bestLoad:-Infinity, bestSet:null, bestAt:null};
    if(t.load > rec.bestLoad){
      rec.bestLoad = t.load; rec.bestSet = {load:t.load, reps:t.reps}; rec.bestAt = session.startedAt;
    }
    state.records[e.exId] = rec;
  });
}

/* ============================================================
   SESSION / WORKOUT ENGINE
   ============================================================ */
function buildSessionExercises(workoutId, mode, phase){
  const wk = WORKOUTS[workoutId];
  let list = wk.exercises.map(e=>Object.assign({}, e));

  // hide optional shrugs entirely if user turned them off in settings
  list = list.filter(e => !(e.optional && !state.settings.showShrugs));

  // reduced mode: drop optional items, shave one set off 3-set exercises
  if(mode==='reduzido'){
    list = list.filter(e => !e.optional);
    list = list.map(e=>{
      const cur = e.sets;
      const next = cur>=3 ? cur-1 : cur;
      return Object.assign({}, e, {sets: next});
    });
  }
  // adaptação (cycles 1-2) and deload (cycle 9): raise RIR target on compound
  // lifts by 1, so effort is visibly and functionally more conservative in
  // both phases — not just described in a banner with no real effect.
  if(phase==='adaptacao' || phase==='deload'){
    list = list.map(e=>{
      const cat = EX[e.id] && EX[e.id].incrementCategory;
      if((cat==='upperFree'||cat==='upperMachine'||cat==='lower') && e.rirMin!=null){
        return Object.assign({}, e, {rirMin: Math.min(4, e.rirMin+1), rirMax: Math.min(4, (e.rirMax!=null?e.rirMax:e.rirMin)+1)});
      }
      return e;
    });
  }
  // deload: halve set counts (min 1), no near-failure framing
  if(phase==='deload'){
    list = list.map(e=> Object.assign({}, e, {sets: Math.max(1, Math.round(e.sets/2))}) );
  }

  // apply persisted substitution preferences
  list = list.map(e=>{
    const pref = state.substitutionPrefs[e.id];
    if(pref) return Object.assign({}, e, {exId:pref, originalId:e.id, substitutedFrom:e.id});
    return Object.assign({}, e, {exId:e.id, originalId:e.id});
  });

  return list.map((e,idx)=>Object.assign({}, e, {
    order: idx+1,
    logged: [],
    approachLogged: [],
    doming: null,
    control: null,
    skipped:false,
  }));
}

function startSession(workoutId, mode){
  const info = getCycleInfo();
  state.activeSession = {
    id: uid('session'),
    workoutId, mode: mode||'completo',
    cycleSnapshot: info,
    phase: 'pretreino', // pretreino -> aquecimento -> exercicios -> corrida -> resumo
    startedAt: Date.now(),
    pausedMs: 0, pauseStart: null,
    currentIndex: 0,
    warmupDone: false,
    exercises: buildSessionExercises(workoutId, mode||'completo', info.phase),
    restTimer: null, // {endAt, durationSec}
    notes:'',
    effort:null,
    runChoice: null,
    programMode:'normal', vacationBlockId:null, vacationLevel:null,
  };
  saveState(true);
}
function startVacationWorkout(workoutId){
  startSession(workoutId, _selectedMode);
  const s=state.activeSession;
  s.programMode='vacation';
  s.vacationBlockId=state.vacation.blockId;
  s.vacationLevel=state.vacation.level;
  // The 24x72 mesociclo doesn't run during vacation, so whatever phase it was
  // frozen at (possibly adaptação/deload/reavaliação) shouldn't shape vacation
  // prescriptions — always use the normal, full "desenvolvimento" template.
  // Manual "modo reduzido" is still available via the usual mode selector.
  if(s.cycleSnapshot.phase!=='desenvolvimento'){
    s.exercises = buildSessionExercises(workoutId, s.mode, 'desenvolvimento');
  }
  saveState(true);
}
function currentExercise(){
  const s=state.activeSession; if(!s) return null;
  return s.exercises[s.currentIndex] || null;
}
function isFirstExercise(){ return state.activeSession && state.activeSession.currentIndex===0; }

function getRestSecondsFor(entry){ return (entry && entry.restSec) || 90; }

function logWorkingSet(fields){
  const s=state.activeSession; const ex=currentExercise(); if(!s||!ex) return;
  ex.logged.push(Object.assign({setNumber: ex.logged.length+1, at:Date.now()}, fields));
  saveState(true);
  startRestTimer(getRestSecondsFor(ex));
}
function undoLastSet(){
  const ex=currentExercise(); if(!ex||!ex.logged.length) return;
  ex.logged.pop();
  if(state.activeSession) state.activeSession.restTimer=null;
  saveState(true);
  toast('Última série desfeita');
}
function deleteSetAt(index){
  const ex=currentExercise(); if(!ex || index==null || !ex.logged[index]) return;
  ex.logged.splice(index,1);
  saveState(true);
}
function logApproachSet(key, fields){
  const ex=currentExercise(); if(!ex) return;
  const existingIdx = ex.approachLogged.findIndex(a=>a.key===key);
  if(existingIdx>=0) ex.approachLogged[existingIdx]=Object.assign({}, ex.approachLogged[existingIdx], fields);
  else ex.approachLogged.push(Object.assign({key}, fields));
  saveState(true);
}
function setDoming(value){
  const ex=currentExercise(); if(!ex) return;
  ex.doming=value; saveState(true);
}
function setControl(value){
  const ex=currentExercise(); if(!ex) return;
  ex.control=value; saveState(true);
}
function markEquipmentBusy(action, substituteId, remember){
  const s=state.activeSession; const ex=currentExercise(); if(!s||!ex) return;
  if(action==='proximo'){ ex.skipped=true; goToExercise(s.currentIndex+1); return; }
  if(action==='substituir' && substituteId){
    ex.substitutedFrom = ex.substitutedFrom || ex.exId;
    ex.exId = substituteId;
    ex.logged = [];
    if(remember) { state.substitutionPrefs[ex.originalId] = substituteId; }
    saveState(true);
  }
}
function goToExercise(idx){
  const s=state.activeSession; if(!s) return;
  if(idx<0) idx=0;
  if(idx>=s.exercises.length){
    const planned = s.programMode==='vacation' ? null : getPlannedRun(s.cycleSnapshot);
    s.phase = planned ? 'corrida' : 'resumo';
    saveState(true); navigate('#/treino/'+s.workoutId); return;
  }
  s.currentIndex=idx; saveState(true); navigate('#/treino/'+s.workoutId);
}
function togglePause(){
  const s=state.activeSession; if(!s) return;
  if(s.pauseStart){ s.pausedMs += (Date.now()-s.pauseStart); s.pauseStart=null; }
  else { s.pauseStart = Date.now(); }
  saveState(true);
}
function discardSession(){ state.activeSession=null; _selectedMode='completo'; saveState(true); }

function computeVolume(session){
  // Unilateral prescriptions (perSide:true) log the SAME rep count done on
  // EACH side, so the mechanical work is double a naive load×reps sum
  // (e.g. remada unilateral 20kg×10 reps "por lado" = 400 kg·reps, not 200).
  let vol=0;
  session.exercises.forEach(e=>{
    if(!e.sets) return;
    const mult = e.perSide ? 2 : 1;
    e.sets.forEach(st=>{ if(!st.isExtra && typeof st.load==='number' && typeof st.reps==='number') vol += st.load*st.reps*mult; });
  });
  return Math.round(vol);
}
const SUBSTANTIAL_SET_THRESHOLD = 0.6; // a session counts toward mesociclo advancement once ~60% of its prescribed sets are logged
function setCompletionRatio(exercisesArr, getPrescribed, getLoggedArr){
  let prescribed=0, done=0;
  exercisesArr.forEach(e=>{
    const req = getPrescribed(e)||0;
    const loggedArr = getLoggedArr(e)||[];
    prescribed += req;
    done += Math.min(loggedArr.filter(x=>!x.isExtra).length, req);
  });
  return prescribed>0 ? done/prescribed : 0;
}
function activeSessionIsSubstantial(exercisesArr){
  return setCompletionRatio(exercisesArr, e=>e.sets, e=>e.logged) >= SUBSTANTIAL_SET_THRESHOLD;
}
function savedSessionIsSubstantial(session){
  return setCompletionRatio(session.exercises, e=>e.prescription?e.prescription.sets:0, e=>e.sets) >= SUBSTANTIAL_SET_THRESHOLD;
}
function cycleTrainingComplete(cycleNumber, mesociclo){
  const hasPush = state.sessions.some(s=>s.cycleNumber===cycleNumber && s.mesociclo===mesociclo && s.workoutId==='push' && savedSessionIsSubstantial(s));
  const hasLegs = state.sessions.some(s=>s.cycleNumber===cycleNumber && s.mesociclo===mesociclo && (s.workoutId==='legsA'||s.workoutId==='legsB') && savedSessionIsSubstantial(s));
  return hasPush && hasLegs;
}
function finalizeSession(forceAdvanceDecision, vacationDecision){
  const s=state.activeSession; if(!s) return null;
  const durationMs = (Date.now()-s.startedAt) - (s.pausedMs||0);
  const record = {
    id:s.id, workoutId:s.workoutId, mode:s.mode,
    cycleNumber:s.cycleSnapshot.cycleNumber, mesociclo:s.cycleSnapshot.mesociclo, dayIndex:s.cycleSnapshot.dayIndex, phase:s.cycleSnapshot.phase,
    programMode: s.programMode||'normal', vacationBlockId: s.vacationBlockId||null, vacationLevel: s.vacationLevel||null,
    startedAt:s.startedAt, durationMs,
    exercises: s.exercises.map(e=>({
      exId:e.exId, originalId:e.originalId, substitutedFrom:e.substitutedFrom||null, perSide:!!e.perSide,
      sets: e.logged, approach: e.approachLogged, doming:e.doming, control:e.control, skipped:e.skipped,
      prescription:{sets:e.sets, repMin:e.repMin, repMax:e.repMax, rirMin:e.rirMin, rirMax:e.rirMax}
    })),
    notes:s.notes, effort:s.effort,
    createdAt:Date.now(),
  };
  const progressions=[]; const substituted=[];
  record.exercises.forEach(e=>{
    const prevBest = state.records[e.exId] ? state.records[e.exId].bestLoad : -Infinity;
    const t = topSet(e.sets);
    if(t && typeof t.load==='number' && t.load>prevBest && isFinite(prevBest)) progressions.push(e.exId);
    if(e.substitutedFrom) substituted.push({from:e.substitutedFrom, to:e.exId});
  });
  const volume = computeVolume(record);
  updateRecordsFromSession(record);
  state.sessions.push(record);
  const isPpl = s.workoutId==='push'||s.workoutId==='pull'||s.workoutId==='legsA'||s.workoutId==='legsB';
  const substantial = activeSessionIsSubstantial(s.exercises);
  const countsAsComplete = vacationDecision==='concluido' || (vacationDecision!=='pendente' && substantial);
  if((s.workoutId==='legsA' || s.workoutId==='legsB') && countsAsComplete){
    state.cycle.nextLegsVariant = s.workoutId==='legsA' ? 'B' : 'A';
  }
  if(s.programMode==='vacation'){
    if(isPpl){
      completeVacationStep({ countsAsActiveDay:true, advancePpl: countsAsComplete ? s.workoutId.replace('legsA','legs').replace('legsB','legs') : null, forced: !countsAsComplete, stat: countsAsComplete?'strengthCompleted':'strengthSkipped' });
    }
  } else if(s.workoutId==='pull'){
    if(forceAdvanceDecision===true){ advanceTrainingCycle(); }
    else if(forceAdvanceDecision===false){ /* user explicitly chose not to advance an incomplete block */ }
    else if(cycleTrainingComplete(record.cycleNumber, record.mesociclo) && substantial){ advanceTrainingCycle(); }
  }
  state.activeSession=null;
  _selectedMode='completo';
  saveState(true);
  return { record, progressions, substituted, volume, durationMs };
}

/* ============================================================
   REST TIMER ENGINE (end-timestamp based, resilient to bg throttling)
   ============================================================ */
let _tickInterval=null;
function ensureTicking(){ if(_tickInterval) return; _tickInterval=setInterval(onTick,250); }
function stopTicking(){ clearInterval(_tickInterval); _tickInterval=null; }

function restRemaining(){
  const s=state.activeSession; if(!s||!s.restTimer) return null;
  const rt=s.restTimer;
  if(rt.paused) return rt.remainingAtPause;
  return Math.max(0, Math.round((rt.endAt-Date.now())/1000));
}
function startRestTimer(sec){
  const s=state.activeSession; if(!s) return;
  s.restTimer = { endAt:Date.now()+sec*1000, durationSec:sec, paused:false, remainingAtPause:null, notified15:false, notifiedDone:false };
  saveState(true); ensureTicking(); refreshRestTimerWidget();
}
function pauseResumeRestTimer(){
  const s=state.activeSession; if(!s||!s.restTimer) return;
  const rt=s.restTimer;
  if(rt.paused){ rt.endAt=Date.now()+rt.remainingAtPause*1000; rt.paused=false; }
  else { rt.remainingAtPause=restRemaining(); rt.paused=true; }
  saveState(true); refreshRestTimerWidget();
}
function adjustRestTimer(deltaSec){
  const s=state.activeSession; if(!s||!s.restTimer) return;
  const rt=s.restTimer;
  if(rt.paused){ rt.remainingAtPause=Math.max(0, rt.remainingAtPause+deltaSec); }
  else { rt.endAt=rt.endAt+deltaSec*1000; if(rt.endAt<Date.now()) rt.endAt=Date.now(); rt.notified15=false; }
  saveState(true); refreshRestTimerWidget();
}
function restartRestTimer(){
  const s=state.activeSession; if(!s||!s.restTimer) return;
  startRestTimer(s.restTimer.durationSec);
}
function skipRestTimer(){
  const s=state.activeSession; if(!s) return;
  s.restTimer=null; saveState(true); refreshRestTimerWidget();
}
function onTick(){
  const s=state.activeSession;
  if(!s){ stopTicking(); return; }
  const elapsedEl=document.getElementById('sessionElapsed');
  if(elapsedEl){
    const pausedNow = s.pauseStart ? (Date.now()-s.pauseStart) : 0;
    const ms=(Date.now()-s.startedAt)-(s.pausedMs||0)-pausedNow;
    elapsedEl.textContent=fmtMin(ms)+' min';
  }
  if(s.restTimer && !s.restTimer.paused){
    const rem=restRemaining();
    const valEl=document.getElementById('restTimerVal');
    if(valEl){
      valEl.textContent=fmtMMSS(rem);
      valEl.classList.toggle('pulse', rem<=10 && rem>0);
    }
    const barEl=document.getElementById('restTimerBar');
    if(barEl){ const pct=clamp(100*(1-rem/s.restTimer.durationSec),0,100); barEl.style.width=pct+'%'; }
    if(rem<=15 && !s.restTimer.notified15){ s.restTimer.notified15=true; vibrate(70); }
    if(rem<=0 && !s.restTimer.notifiedDone){ s.restTimer.notifiedDone=true; vibrate([120,60,120]); beep(660,280); }
  }
}
function refreshRestTimerWidget(){
  const wrap=document.getElementById('restTimerWidget');
  if(wrap) wrap.innerHTML = restTimerWidgetHTML();
}
function restTimerWidgetHTML(){
  const s=state.activeSession; if(!s) return '';
  if(!s.restTimer){
    return '';
  }
  const rt=s.restTimer;
  const rem = restRemaining();
  const pct = clamp(100*(1-rem/rt.durationSec),0,100);
  const ex = currentExercise();
  const lastSet = ex && ex.logged.length ? ex.logged[ex.logged.length-1] : null;
  let lastInfo='';
  if(lastSet && ex.logType==='strength'){
    lastInfo = 'Última série: '+(typeof lastSet.load==='number'?lastSet.load+' kg':'—')+' × '+(lastSet.reps!=null?lastSet.reps:'—')+' reps'+(lastSet.rir!=null?' · RIR '+lastSet.rir:'');
  }
  return ''+
  '<div class="card" style="border-color:var(--accent);background:var(--card-alt)">'+
    '<div class="row" style="margin-bottom:8px"><span class="section-label" style="margin:0">Descanso</span>'+
      '<button class="link-btn" data-action="rest-skip">Pular</button></div>'+
    '<div id="restTimerVal" class="timer-display '+(rem<=10&&rem>0?'pulse':'')+'">'+fmtMMSS(rem)+'</div>'+
    '<div class="progress-track" style="margin:10px 0"><div id="restTimerBar" class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="btn-row">'+
      '<button class="btn btn-sm btn-outline" data-action="rest-adjust" data-delta="-15">-15s</button>'+
      '<button class="btn btn-sm btn-outline" data-action="rest-pause">'+(rt.paused?icon('play')+'Retomar':icon('pause')+'Pausar')+'</button>'+
      '<button class="btn btn-sm btn-outline" data-action="rest-adjust" data-delta="15">+15s</button>'+
      '<button class="btn btn-sm btn-outline" data-action="rest-restart">Reiniciar</button>'+
    '</div>'+
    (lastInfo? '<p class="readonly-note" style="margin-top:10px">'+escapeHtml(lastInfo)+'</p>' : '')+
  '</div>';
}

/* ============================================================
   LIGHTWEIGHT SVG CHARTS (no dependencies)
   ============================================================ */
function svgLineChart(points, opts){
  opts=opts||{};
  const w=opts.width||320, h=opts.height||130, pad=26;
  if(!points || points.length<2){
    return '<div class="empty-state" style="padding:22px 0"><p class="readonly-note">Registre mais alguns pontos para ver a evolução no gráfico.</p></div>';
  }
  const ys=points.map(p=>p.y);
  let minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  if(opts.milestone!=null){ minY=Math.min(minY,opts.milestone); maxY=Math.max(maxY,opts.milestone); }
  if(minY===maxY){ minY-=1; maxY+=1; }
  const rangeY=(maxY-minY);
  const stepX=(w-2*pad)/(points.length-1);
  const toX=i=>pad+i*stepX;
  const toY=y=>h-pad-((y-minY)/rangeY)*(h-2*pad);
  const path=points.map((p,i)=>(i===0?'M':'L')+toX(i).toFixed(1)+' '+toY(p.y).toFixed(1)).join(' ');
  const dots=points.map((p,i)=>'<circle class="chart-dot" cx="'+toX(i).toFixed(1)+'" cy="'+toY(p.y).toFixed(1)+'" r="3"></circle>').join('');
  let grid='';
  for(let i=0;i<=2;i++){ const y=pad+i*(h-2*pad)/2; grid+='<line x1="'+pad+'" x2="'+(w-pad)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/>'; }
  let milestone='';
  if(opts.milestone!=null){
    const my=toY(opts.milestone);
    milestone='<line class="chart-milestone" x1="'+pad+'" x2="'+(w-pad)+'" y1="'+my.toFixed(1)+'" y2="'+my.toFixed(1)+'"/>';
  }
  const firstLabel=points[0].label||'', lastLabel=points[points.length-1].label||'';
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      '<g class="chart-grid">'+grid+'</g>'+milestone+
      '<path class="chart-line" d="'+path+'"></path>'+dots+
    '</svg>'+
    '<div class="row"><span class="kbd-hint">'+escapeHtml(firstLabel)+'</span>'+(opts.milestoneLabel?'<span class="kbd-hint" style="color:var(--warn)">'+escapeHtml(opts.milestoneLabel)+'</span>':'<span></span>')+'<span class="kbd-hint">'+escapeHtml(lastLabel)+'</span></div>';
}

   ============================================================ */
let _selectedMode = 'completo';
let _onbStep = 1;

function parseHash(){
  const h=(location.hash||'#/hoje').replace(/^#\/?/,'');
  return h.split('/').filter(Boolean);
}
function navigate(hash){
  if(location.hash===hash) render(); else location.hash=hash;
}
function render(){
  const parts=parseHash();
  if(!state.onboarded && parts[0]!=='onboarding'){ location.hash='#/onboarding'; return; }
  const route=parts[0]||'hoje';
  let html='';
  try{
    switch(route){
      case 'onboarding': html=screenOnboarding(); break;
      case 'hoje': html=screenHoje(); break;
      case 'corrigir-ciclo': html=screenCorrigirCiclo(); break;
      case 'treino': html = parts[1] ? screenTreino(parts[1]) : screenBrowseTreinos(); break;
      case 'evolucao': html=screenEvolucao(parts[1]||'forca'); break;
      case 'ciclos': html = parts[1]==='reavaliacao' ? screenReavaliacao() : screenCiclos(); break;
      case 'ajustes': html=screenAjustes(); break;
      case 'biblioteca': html = parts[1] ? screenExercicioDetalhe(parts[1]) : screenBiblioteca(); break;
      case 'registrar-corrida': html=screenRegistrarCorrida(); break;
      case 'registrar-medida': html=screenRegistrarMedida(); break;
      case 'ferias': html = parts[1]==='proximos' ? screenFeriasProximos() : parts[1]==='relatorio' ? screenFeriasRelatorio() : screenFeriasConfigurar(); break;
      default: html=screenHoje();
    }
  }catch(err){
    console.error('Erro ao renderizar tela', route, err);
    html='<div class="screen"><div class="card"><p class="card-title">Algo deu errado nesta tela</p><p class="readonly-note" style="margin-top:8px">'+escapeHtml(err.message)+'</p><button class="btn btn-primary" style="margin-top:14px" data-nav="#/hoje">Voltar para Hoje</button></div></div>';
  }
  document.getElementById('app').innerHTML=html;
  renderOverlay();
  if(state.activeSession) ensureTicking(); else stopTicking();
  try{ window.scrollTo(0,0); }catch(e){}
}
window.addEventListener('hashchange', render);

/* ============================================================
   FORMATTERS FOR EXERCISE PRESCRIPTION / SETS
   ============================================================ */
function formatPrescription(e){
  const setsLabel = e.setsLabel || e.sets;
  if(e.logType==='plank') return `${setsLabel} séries × ${e.durMin}–${e.durMax}s`;
  if(e.logType==='carry') return `${setsLabel} séries × ${e.distMin}–${e.distMax}m${e.perSide?' por lado':''}`;
  if(e.logType==='core-reps'){
    let s = `${setsLabel} séries × ${e.repMin}-${e.repMax}${e.perSide?' por lado':''}`;
    if(e.holdSec) s += ` · segure ${e.holdSec}s`;
    return s;
  }
  let s = `${setsLabel} séries × ${e.repMin}-${e.repMax}${e.perSide?' por lado':''}`;
  if(e.rirMin!=null) s += ` · RIR ${e.rirMin===e.rirMax? e.rirMin : e.rirMin+'-'+e.rirMax}`;
  s += ` · Descanso ${e.restSec>=60? (Math.round(e.restSec/6)/10)+' min' : e.restSec+'s'}`;
  return s;
}
function setRowsHTML(ex){
  if(!ex.logged.length) return `<tr class="current"><td colspan="5">Nenhuma série registrada ainda</td></tr>`;
  return ex.logged.map((s,i)=>{
    const extraTag = s.isExtra? ' <span class="chip tag-idle" style="padding:1px 6px;font-size:10px;vertical-align:middle">extra</span>' : '';
    let inner='';
    if(ex.logType==='strength'){
      inner = `<td>${i+1}</td><td>${s.load!=null?s.load+' kg':'—'}</td><td>${s.reps!=null?s.reps:'—'}</td><td>RIR ${s.rir!=null?s.rir:'—'}${extraTag}</td><td class="check">${icon('check')}</td>`;
    } else if(ex.logType==='core-reps'){
      inner = `<td>${i+1}</td><td colspan="2">${s.reps!=null?s.reps+' /lado':'—'}${s.load!=null?(' · '+s.load+' kg'):''}${extraTag}</td><td>${s.control||'—'}</td><td class="check">${icon('check')}</td>`;
    } else if(ex.logType==='plank'){
      inner = `<td>${i+1}</td><td colspan="2">${s.durationSec!=null? s.durationSec+' s':'—'}${extraTag}</td><td>${s.control||'—'}</td><td class="check">${icon('check')}</td>`;
    } else if(ex.logType==='carry'){
      inner = `<td>${i+1}</td><td colspan="2">${s.load!=null?s.load+' kg':'—'} · ${s.distance!=null?s.distance+' m':'—'}${extraTag}</td><td>${s.control||'—'}</td><td class="check">${icon('check')}</td>`;
    }
    return `<tr data-action="edit-set" data-index="${i}" style="cursor:pointer">${inner}</tr>`;
  }).join('');
}
function setTableHeaderHTML(logType){
  if(logType==='strength') return `<tr><th>Série</th><th>Carga</th><th>Reps</th><th>RIR</th><th></th></tr>`;
  return `<tr><th>Série</th><th colspan="2">Registro</th><th>Controle</th><th></th></tr>`;

function historyLineHTML(exId, prescription, ctx){
  const hist = findLastSessionExercise(exId);
  if(!hist) return `<p class="card-sub" style="margin-top:6px">Ainda sem histórico para este exercício.</p>`;
  const sets = hist.entry.sets;
  const t = topSet(sets);
  const seq = sets.map(s=> s.reps!=null? s.reps : (s.durationSec!=null? s.durationSec+'s': (s.distance!=null? s.distance+'m':'—'))).join('-');
  const loadStr = t && typeof t.load==='number' ? `${t.load} kg · ` : '';
  const lastRir = sets.length && sets[sets.length-1].rir!=null ? ` · RIR final ${sets[sets.length-1].rir}` : '';
  const sugg = evaluateProgression(exId, prescription, sets, ctx||{mode:'completo',phase:'desenvolvimento'});
  const suggStr = sugg ? ` · Sugestão: ${PROG_LABEL[sugg.type].label}` : '';
  return `<p class="card-sub" style="margin-top:6px">Última sessão: ${loadStr}${seq}${lastRir}${suggStr}</p>`;
}

function sessionCompletionStats(s){
  let complete=0, partial=0, setsLogged=0, setsPrescribed=0;
  s.exercises.forEach(e=>{
    const req=e.sets||0;
    const done=e.logged.filter(x=>!x.isExtra).length;
    setsPrescribed+=req;
    setsLogged+=Math.min(done, req);
    if(e.skipped) return;
    if(req>0 && done>=req) complete++;
    else if(done>0) partial++;
  });
  return {complete, partial, total:s.exercises.length, setsLogged, setsPrescribed};
}

  const volume=computeVolume({exercises:s.exercises.map(e=>({sets:e.logged, perSide:!!e.perSide}))});
  const stats=sessionCompletionStats(s);
  const subCount = s.exercises.filter(e=>e.substitutedFrom).length;
  return `<div class="screen no-bottom-pad">
    ${sessionHeaderHTML(s,wk,{subtitle:'Resumo'})}
    <div class="stack">

let _sheetType=null;
let _draft={};
function closeSheet(){ _sheetType=null; renderOverlay(); }
/* NOTE: renderOverlay() itself is defined once, later in this file, after all
   sheet HTML builders exist (equipment/import/etc). Keeping a single source
   of truth avoids the maintenance hazard of two silently-shadowing definitions. */

function stepperField(label, key, value, unit, step, min){
  return `<div class="field"><label>${label}</label>
    <div class="stepper">
      <button data-action="draft-step" data-key="${key}" data-delta="${-step}" data-min="${min!=null?min:0}">−</button>
      <span class="val">${value}</span>
      <button data-action="draft-step" data-key="${key}" data-delta="${step}">+</button>
      <span class="unit">${unit}</span>
    </div></div>`;
}
function segField(label, key, value, options){
  return `<div class="field"><label>${label}</label>
    <div class="pill-select">${options.map(o=>`<button class="${value===o.v?'active':''}" data-action="draft-set" data-key="${key}" data-value="${o.v}">${o.l}</button>`).join('')}</div>
  </div>`;
}
function setSheetHTML(){
  const ex=currentExercise(); const exData=EX[ex.exId];
  const d=_draft;
  const isEdit = d.__editIndex!=null;
  let fields='';
  if(exData.logType==='strength'){
    fields = stepperField('Carga', 'load', d.load, 'kg', weightedIncrement(ex.exId), 0)
      + stepperField('Repetições', 'reps', d.reps, 'reps', 1, 0)
      + stepperField('RIR', 'rir', d.rir, '', 1, 0)
      + segField('Técnica', 'technique', d.technique, [{v:'boa',l:'Boa'},{v:'aceitavel',l:'Aceitável'},{v:'ruim',l:'Ruim'}]);
  } else if(exData.logType==='core-reps'){
    fields = stepperField('Repetições por lado', 'reps', d.reps, 'reps', 1, 0)
      + (ex.exId==='pallof-press'? stepperField('Carga (cabo)', 'load', d.load, 'kg', weightedIncrement(ex.exId), 0) : '')
      + segField('Controle', 'control', d.control, [{v:'bom',l:'Bom'},{v:'moderado',l:'Moderado'},{v:'ruim',l:'Ruim'}]);
  } else if(exData.logType==='plank'){
    fields = stepperField('Duração', 'duration', d.duration, 's', 5, 0)
      + segField('Controle', 'control', d.control, [{v:'bom',l:'Bom'},{v:'moderado',l:'Moderado'},{v:'ruim',l:'Ruim'}]);

  const showDoming = ['dead-bug','pallof-press','bird-dog','prancha','suitcase-carry'].includes(ex.exId);
  return `<div class="sheet"><div class="sheet-grab"></div>

/* ============================================================
   HELPERS: HISTORY SERIES / STATS
   ============================================================ */
function exerciseHistorySeries(exId){
  const points=[];
  state.sessions.forEach(sess=>{
    const entry=sess.exercises.find(e=>e.exId===exId);
    if(entry && entry.sets && entry.sets.length){
      const t=topSet(entry.sets);
      if(t && typeof t.load==='number') points.push({y:t.load, label:fmtDateShort(todayISO(new Date(sess.startedAt)))});
    }
  });
  return points;
}
function emptyState(msg){ return `<div class="empty-state"><div class="ico">—</div><p>${escapeHtml(msg)}</p></div>`; }

function consistencyStats(){
  const modeCounts={completo:0,reduzido:0,recuperacao:0};
  state.sessions.forEach(s=>{ modeCounts[s.mode]=(modeCounts[s.mode]||0)+1; });
  const last30=state.sessions.filter(s=>isWithinLastDays(todayISO(new Date(s.startedAt)),30)).length;
  const recoveryTotal=(state.recoveryLogs||[]).length;
  const recoveryLast30=(state.recoveryLogs||[]).filter(r=>isWithinLastDays(r.date,30)).length;
  const doneMap={};
  state.sessions.forEach(s=>{
    const abs=s.mesociclo*10+s.cycleNumber;
    const type=(s.workoutId==='legsA'||s.workoutId==='legsB')?'legs':s.workoutId;
    doneMap[abs]=doneMap[abs]||new Set(); doneMap[abs].add(type);
  });
  const curInfo=getCycleInfo();
  const curAbs=curInfo.mesociclo*10+curInfo.cycleNumber;
  let streak=0;
  for(let a=curAbs-1; a>=0; a--){
    const set=doneMap[a];
    if(set && set.has('push') && set.has('pull') && set.has('legs')) streak++;
    else break;
  }
  return {modeCounts, last30, streak, total:state.sessions.length, recoveryTotal, recoveryLast30};
}

/* ============================================================
   SET-SHEET SUPPORT FUNCTIONS
   ============================================================ */
function openSetSheet(isExtra){
  const ex=currentExercise(); if(!ex) return;
  const rec=state.records[ex.exId];
  const hist=findLastNonDeloadSessionExercise(ex.exId);
  let suggestedLoad = rec && rec.nextSuggestedLoad!=null ? rec.nextSuggestedLoad : null;
  if(suggestedLoad==null && ex.logged.length){ const t=topSet(ex.logged.filter(s=>!s.isExtra)); if(t) suggestedLoad=t.load; }
  if(suggestedLoad==null && hist){ const t=topSet(hist.entry.sets); if(t) suggestedLoad=t.load; }
  const isDeload = state.activeSession.cycleSnapshot.phase==='deload';
  if(isDeload && suggestedLoad!=null){
    // Deload target: ~70% of the working weight, for THIS session's display
    // only — the stored nextSuggestedLoad reference is left untouched so
    // normal progression resumes correctly once the deload week is over.
    // Rounded to the exercise's own configured increment (not a blanket
    // 0.5kg) so it never suggests a plate combination that doesn't exist.
    suggestedLoad = roundToIncrement(suggestedLoad*DELOAD_LOAD_FACTOR, weightedIncrement(ex.exId));
  }
  const suggestedReps = rec && rec.nextSuggestedReps!=null ? rec.nextSuggestedReps : (ex.repMax || ex.repMin || 0);
  const suggestedDuration = rec && rec.nextSuggestedDuration!=null ? rec.nextSuggestedDuration : (ex.durMax||30);
  _draft={
    __editIndex:null, __isExtra:!!isExtra,
    load: suggestedLoad!=null? suggestedLoad : 0,
    reps: suggestedReps,
    rir: ex.rirMin!=null? ex.rirMin : 2,
    technique:'boa',
    discomfort:'nenhum',
    control:'bom',
    duration: suggestedDuration,
    distance: ex.distMax||20,
    doming:'nao-ocorreu',
  };
  _sheetType='set';
  renderOverlay();
}
function openEditSetSheet(index){
  const ex=currentExercise(); if(!ex) return;
  const s=ex.logged[index]; if(!s) return;
  _draft={
    __editIndex:index, __isExtra:!!s.isExtra,
    load: s.load!=null? s.load:0,
    reps: s.reps!=null? s.reps:0,
    rir: s.rir!=null? s.rir:0,
    technique: s.technique||'boa',
    discomfort: s.discomfort||'nenhum',
    control: s.control||'bom',
    duration: s.durationSec!=null? s.durationSec:0,
    distance: s.distance!=null? s.distance:0,
    doming: s.doming||'nao-ocorreu',
  };
  _sheetType='set';
  renderOverlay();
}
function saveSetFromDraft(){
  const ex=currentExercise(); if(!ex) return;
  const exData=EX[ex.exId]; const d=_draft;
  let fields={};
  if(exData.logType==='strength'){
    fields={load:Number(d.load), reps:Number(d.reps), rir:Number(d.rir), technique:d.technique, discomfort:d.discomfort};
  } else if(exData.logType==='core-reps'){
    fields={reps:Number(d.reps), control:d.control, discomfort:d.discomfort, doming:d.doming};
    if(ex.exId==='pallof-press') fields.load=Number(d.load);
  } else if(exData.logType==='plank'){
    fields={durationSec:Number(d.duration), control:d.control, discomfort:d.discomfort, doming:d.doming};
  } else if(exData.logType==='carry'){
    fields={load:Number(d.load), distance:Number(d.distance), control:d.control, discomfort:d.discomfort, doming:d.doming};
  }
  if(d.__editIndex!=null){
    const existing=ex.logged[d.__editIndex];
    ex.logged[d.__editIndex]=Object.assign({}, existing, fields);
    saveState(true);
    toast('Série atualizada');
  } else {
    if(d.__isExtra) fields.isExtra=true;
    logWorkingSet(fields);
  }
  _sheetType=null;
  render();
}
function acceptProgression(){
  const ex=currentExercise(); if(!ex) return;
  const ctx={mode:state.activeSession.mode, phase:state.activeSession.cycleSnapshot.phase, wasSubstituted:!!ex.substitutedFrom};
  const sugg=evaluateProgression(ex.exId, ex, ex.logged, ctx);
  if(!sugg) return;
  const rec=state.records[ex.exId]||{};
  const last=topSet(ex.logged);
  const lastLogged = ex.logged.length? ex.logged[ex.logged.length-1] : null;
  if(sugg.type==='aumentar-carga'){
    rec.nextSuggestedLoad=(last&&typeof last.load==='number'?last.load:0)+(sugg.amount||weightedIncrement(ex.exId));
    // Double progression: new (heavier) weight starts back at the BOTTOM of
    // the rep range next time, not the top — otherwise "aumentar carga"
    // combined with the old suggested-reps default just kept climbing reps
    // past the ceiling instead of actually trading reps for load.
    if(ex.repMin!=null) rec.nextSuggestedReps = ex.repMin;
  }
  else if(sugg.type==='aumentar-tempo') rec.nextSuggestedDuration=(lastLogged&&typeof lastLogged.durationSec==='number'? lastLogged.durationSec+5 : (ex.durMax||30)+5);
  else if(sugg.type==='aumentar-dificuldade'){ /* qualitative — nothing numeric to persist */ }
  else if(sugg.type==='reduzir') rec.nextSuggestedLoad = last&&typeof last.load==='number'? Math.max(0,last.load-weightedIncrement(ex.exId)) : null;
  else if(sugg.type==='manter'){ if(last && typeof last.load==='number') rec.nextSuggestedLoad=last.load; }
  state.records[ex.exId]=rec;
  saveState(true);
  toast('Sugestão salva para a próxima sessão');
}
function applyTheme(theme){
  state.settings.theme=theme;
  document.documentElement.setAttribute('data-theme', theme);
  saveState(true);
}
function postCycleCorrection(){ toast('Ciclo atualizado'); navigate('#/hoje'); }
function handlePostSituChoice(){
  if(!state.onboarded){ _onbStep=2; render(); }
  else { postCycleCorrection(); }
}

function handleAction(el){
  const action=el.dataset.action;
  switch(action){

    case 'situ-pos': correctCycle('pos-plantao'); handlePostSituChoice(); return;
    case 'situ-folga': correctCycle('folga-plena'); handlePostSituChoice(); return;

    case 'situ-proximo': {
      const inp=document.getElementById('onbNextShift');
      if(!inp || !inp.value){ toast('Escolha uma data'); return; }
      correctCycle('proximo-plantao', inp.value); handlePostSituChoice(); return;

    case 'onb-toggle-date': {
      const box=document.getElementById('onbDateBox');

      _formDraft.duration = stepType==='zona2curta'?25:stepType==='zona2longa'?40:30;

/* ==================================================== 18. SELETOR DE ALIMENTOS */
UI.openPicker = function (cb, cat) {

  $("#picker-search").value = "";
  $("#picker").classList.add("open");
  $("#picker").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

};
UI.closePicker = function () {
  $("#picker").classList.remove("open");
  $("#picker").setAttribute("aria-hidden", "true");

  UI.pickerCb = null;

UI.renderPickerCats = function () {
  var host = $("#picker-cats");

};

UI.renderPickerResults = function (q) {
  var host = $("#picker-results");
  host.innerHTML = "";
  var results = DB.search(q, UI.pickerCat);
  if (!results.length) {
    host.appendChild(UI.emptyState("Nada encontrado", "Nenhum alimento corresponde a essa busca.", "Criar alimento personalizado", function () {
      UI.newCustomFood(q, function (food) {
        if (UI.pickerCb) { var cb = UI.pickerCb; UI.closePicker(); cb(food); }
      });
    }));
    return;
  }
  results.forEach(function (f) {
    var b = el("button", { class: "food-row", onclick: function () {
      var cb = UI.pickerCb;
      UI.closePicker();
      if (cb) cb(f);
    } });
    b.appendChild(el("span", { class: "fv" }, [
      el("b", { text: f.name }),
      el("span", { text: U.fmt(f.per100.kcal) + " kcal · P " + U.fmt(f.per100.protein, 1) + " · C " + U.fmt(f.per100.carb, 1) + " · IG " + (f.gi || "—") + " /100" + f.unit })
    ]));
    b.appendChild(UI.confDots(f.conf));
    host.appendChild(b);
  });
  host.appendChild(el("button", { class: "btn btn-ghost btn-block", style: "margin-top:8px", text: "Criar alimento personalizado", onclick: function () {
    UI.newCustomFood(q, function (food) {
      if (UI.pickerCb) { var cb = UI.pickerCb; UI.closePicker(); cb(food); }
    });
  } }));
};
/* ==================================================== 19. RELATÓRIOS */
UI.reportPeriod = "week";
UI.reportOffset = 0;

UI.renderReports = function () {
  var host = $("#relatorios-content");
  host.innerHTML = "";
  var isWeek = UI.reportPeriod === "week";
  var from, to, label;

  if (isWeek) {
    from = U.addDays(U.weekStart(U.todayISO()), UI.reportOffset * 7);
    to = U.addDays(from, 6);
    label = UI.reportOffset === 0 ? "Esta semana" : (UI.reportOffset === -1 ? "Semana passada" : U.dateShort(from) + " a " + U.dateShort(to));
  } else {
    var base = U.fromISO(U.todayISO());
    base.setDate(1);
    base.setMonth(base.getMonth() + UI.reportOffset);
    from = U.toISO(base);
    to = U.addDays(U.toISO(new Date(base.getFullYear(), base.getMonth() + 1, 0, 12)), 0);
    label = U.MONTHS[base.getMonth()].replace(/^\w/, function (c) { return c.toUpperCase(); }) + " de " + base.getFullYear();
  }

  var agg = D.aggregate(from, to);
  var analysis = R.period(agg, isWeek ? "week" : "month");

  /* navegação de período */
  var nav = el("div", { class: "card tight" }, [
    el("div", { class: "row between" }, [
      el("button", { class: "btn-icon btn-outline", text: "‹", "aria-label": "Período anterior", onclick: function () { UI.reportOffset--; UI.renderReports(); } }),
      el("div", { style: "text-align:center;flex:1" }, [
        el("p", { style: "font-weight:650", text: label }),
        el("p", { class: "tiny faint", text: U.dateShort(from) + " – " + U.dateShort(to) + " · " + agg.daysLogged + " de " + agg.daysTotal + " dias registrados" })
      ]),
      el("button", { class: "btn-icon btn-outline", text: "›", "aria-label": "Próximo período", disabled: UI.reportOffset >= 0, onclick: function () { if (UI.reportOffset < 0) { UI.reportOffset++; UI.renderReports(); } } })
    ])
  ]);
  host.appendChild(nav);

  if (agg.daysLogged === 0) {
    host.appendChild(el("div", { class: "card" }, [
      UI.emptyState("Nenhum dia registrado", "Não há refeições consumidas neste período.", "Registrar refeição", function () { UI.setTab("registrar"); })
    ]));
    return;
  }

  /* médias */
  var avgCard = el("div", { class: "card" });
  avgCard.appendChild(el("p", { class: "eyebrow", text: "Médias diárias" }));
  avgCard.appendChild(el("div", { class: "grid-3", style: "margin-top:10px" }, [
    el("div", { class: "hstat" }, [el("div", { class: "l", text: "kcal" }), el("div", { class: "v", text: U.fmt(agg.avg.kcal) })]),
    el("div", { class: "hstat" }, [el("div", { class: "l", text: "proteína" }), el("div", { class: "v", text: U.fmt(agg.avg.protein) })]),
    el("div", { class: "hstat" }, [el("div", { class: "l", text: "CG" }), el("div", { class: "v", text: U.fmt(agg.avg.gl) })])
  ]));
  avgCard.appendChild(el("div", { class: "grid-3", style: "margin-top:10px" }, [
    el("div", { class: "hstat" }, [el("div", { class: "l", text: "carbo" }), el("div", { class: "v", text: U.fmt(agg.avg.carb) })]),

UI.chartCard = function (title, agg, key, type, band) {
  var card = el("div", { class: "card" });
  card.appendChild(el("div", { class: "row between" }, [
    el("p", { class: "eyebrow", text: title }),
    el("span", { class: "tiny faint", text: "média " + U.fmt(agg.avg[key === "gl" ? "gl" : key], key === "gl" ? 0 : 0) })
  ]));
  var cv = el("canvas", { "aria-label": "Gráfico: " + title });
  card.appendChild(cv);
  var labels = agg.series.map(function (s) {
    return agg.series.length <= 7 ? U.WEEKDAYS_S[U.fromISO(s.date).getDay()] : String(U.fromISO(s.date).getDate());
  });
  var values = agg.series.map(function (s) { return s[key]; });
  var colors = agg.series.map(function (s) {
    if (!s.logged) return Ch.css("--surface-2");
    return s.training ? Ch.css("--citrine") : Ch.css("--accent");
  });
  requestAnimationFrame(function () {
    Ch.draw(cv, { type: type, height: 165, values: values, labels: labels, band: band, colors: colors, color: Ch.css("--accent") });
  });
  card.appendChild(el("p", { class: "tiny faint", style: "margin-top:6px", text: type === "bar" ? "Barras em verde-limão indicam dias com treino. A faixa clara é a sua meta." : "A faixa clara é a referência diária adequada." }));
  return card;
};

/* ---------- metas estimadas por tipo de dia ---------- */
PL.targets = function (dayId) {
  var c = PL.cfg(), d = PL.day(dayId);
  var bmr = 10 * c.weight + 6.25 * c.height - 5 * c.age + (c.sex === "f" ? -161 : 5);
  var maint = bmr * d.factor;
  var kcal = Math.round(maint * (1 - c.deficit));
  var floor = Math.round(bmr * 1.15);
  if (kcal < floor) kcal = floor;
  var protein = U.clamp(Math.round(c.weight * 1.9 / 5) * 5, c.proteinMin, c.proteinMax);
  var fat = Math.round(c.weight * (d.carbTone === "alto" ? 0.75 : 0.85) / 5) * 5;
  var carb = Math.max(100, Math.round((kcal - protein * 4 - fat * 9) / 4 / 5) * 5);
  return {
    bmr: Math.round(bmr), maint: Math.round(maint),
    kcal: kcal, kcalRange: [Math.round(kcal * 0.94), Math.round(kcal * 1.06)],
    protein: protein, proteinRange: [c.proteinMin, c.proteinMax],
    carb: carb, carbRange: [Math.round(carb * 0.88), Math.round(carb * 1.12)],
    fat: fat, fatRange: [Math.round(fat * 0.85), Math.round(fat * 1.15)],
    fiber: [25, 40]
  };
};

/* ---------- cálculo: modelo → refeição → análise ---------- */
PL.toMeal = function (tpl, opts) {
  opts = opts || {};
  var m = D.newMeal({
    mealType: opts.mealType || tpl.mealType,
    mode: "consumed",
    source: "plan",
    context: opts.context || (tpl.tags[0] || "nenhum")
  });
  if (opts.time) m.time = opts.time;
  m.note = tpl.name;
  var mult = U.n(opts.mult, 1) || 1;
  tpl.items.forEach(function (x) {
    var f = DB.get(x.id);
    if (!f) return;
    m.items.push(C.itemFromFood(f, Math.max(1, Math.round(x.g * mult))));
  });
  return m;
};
PL.analyze = function (tpl, mult) { return C.meal(PL.toMeal(tpl, { mult: mult })); };

/* Média das marmitas selecionadas: é o que o dia realmente recebe quando a
   rotação vai variando ao longo da semana. */
PL.selectedMarmitas = function () {
  var sel = PL.cfg().selection, out = [];
  PL.byCat("marmita").forEach(function (t) {
    var q = U.pos(sel[t.id]);
    if (q > 0) out.push({ tpl: t, qty: Math.round(q) });
  });
  return out;
};
PL.marmitaAverage = function () {
  var list = PL.selectedMarmitas(), tot = 0, acc = null;
  if (!list.length) return null;
  list.forEach(function (s) {
    var a = PL.analyze(s.tpl);
    if (!acc) acc = { kcal: 0, protein: 0, carb: 0, fiber: 0, fat: 0, gl: 0 };
    ["kcal", "protein", "carb", "fiber", "fat", "gl"].forEach(function (k) { acc[k] += U.pos(a[k]) * s.qty; });
    tot += s.qty;
  });
  if (!tot) return null;
  Object.keys(acc).forEach(function (k) { acc[k] = U.round(acc[k] / tot, 1); });
  acc.count = tot;
  acc.glClass = C.glClass(acc.gl);
  return acc;
};

/* Porção maior da mesma marmita: escala linear, usada nos dias de treino. */
PL.scaleAnalysis = function (a, mult) {
  if (!mult || mult === 1) return a;
  var out = { count: a.count, mult: mult };
  ["kcal", "protein", "carb", "fiber", "fat", "gl"].forEach(function (k) { out[k] = U.round(U.pos(a[k]) * mult, 1); });
  out.glClass = C.glClass(out.gl);
  return out;
};

PL.dayAnalysis = function (dayId) {
  var menu = PL.MENUS[dayId] || [], avg = PL.marmitaAverage();
  var tot = { kcal: 0, protein: 0, carb: 0, fiber: 0, fat: 0, gl: 0 }, slots = [];
  menu.forEach(function (s) {
    var a = null;
    if (s.marmita) a = avg ? PL.scaleAnalysis(avg, s.mult || 1) : null;
    else { var t = PL.tpl(s.tpl); a = t ? PL.analyze(t) : null; }
    if (a) ["kcal", "protein", "carb", "fiber", "fat", "gl"].forEach(function (k) { tot[k] += U.pos(a[k]); });
    slots.push({ slot: s, analysis: a });
  });
  Object.keys(tot).forEach(function (k) { tot[k] = U.round(tot[k], 0); });
  tot.glClass = C.dayGlClass ? C.dayGlClass(tot.gl) : C.glClass(tot.gl);
  return { slots: slots, totals: tot, targets: PL.targets(dayId), hasMarmita: !!avg };
};

PL.shopping = function (list) {
  var acc = {};
  (list || []).forEach(function (s) {
    var t = s.tpl || PL.tpl(s.id);
    if (!t) return;
    t.items.forEach(function (x) {
      acc[x.id] = U.pos(acc[x.id]) + x.g * s.qty;
    });
  });
  var groups = {};
  Object.keys(acc).forEach(function (id) {
    var f = DB.get(id);
    if (!f) return;
    var raw = PL.RAW[id] || { f: 1 };
    var cooked = Math.round(acc[id]);
    var amount = Math.round(cooked * (raw.f || 1));
    var g = groups[f.cat] || (groups[f.cat] = []);
    g.push({
      id: id, name: f.name, cooked: cooked, amount: amount,
      label: raw.label || "", unitG: raw.unitG || 0, unitLabel: raw.unitLabel || "",
      units: raw.unitG ? Math.ceil(amount / raw.unitG) : 0
    });
  });
  var out = [];
  App.CATEGORIES.forEach(function (c) {
    if (groups[c.id]) {
      groups[c.id].sort(function (a, b) { return b.amount - a.amount; });
      out.push({ cat: c.label, items: groups[c.id] });
    }
  });
  return out;
};

PL.prepSteps = function (list) {
  var has = {};
  (list || []).forEach(function (s) {
    var t = s.tpl || PL.tpl(s.id);
    if (t) t.items.forEach(function (x) { has[x.id] = true; });
  });
  var steps = [];
  if (has.feijao_carioca || has.feijao_preto || has.grao_de_bico_cozido || has.lentilha_cozida)
    steps.push("Deixe as leguminosas de molho na noite anterior e cozinhe todas de uma vez na pressão. É o item que mais demora e o que melhor congela.");
  if (has.arroz_branco_cozido || has.arroz_integral_cozido)
    steps.push("Cozinhe o arroz em panela grande. O integral leva cerca de 40 minutos e pode ir junto com o branco em fogões de duas bocas livres.");
  if (has.peito_frango_grelhado || has.carne_bovina_grelhada || has.carne_moida_refogada || has.tilapia_grelhada)
    steps.push("Tempere as carnes na véspera. Grelhe em lotes, sem lotar a frigideira, para não cozinhar no próprio líquido. Pese depois de pronta: é assim que os números do plano foram calculados.");
  if (has.brocolis_cozido || has.cenoura_cozida || has.abobrinha_refogada || has.couve_refogada)
    steps.push("Os legumes vão por último, no vapor ou refogados rapidamente. Deixe firmes: eles terminam de cozinhar quando você requentar a marmita.");
  steps.push("Monte as marmitas ainda mornas, mas espere esfriar antes de tampar e levar à geladeira. Tampar quente cria condensação e encurta a validade.");
  steps.push("Geladeira: até 3 dias. Freezer: até 30 dias. Marque a data na tampa. As duas primeiras marmitas do ciclo ficam na geladeira; o resto vai congelado.");
  if (has.pao_forma_integral)
    steps.push("Os sanduíches não vão prontos. Guarde o recheio em pote e monte na hora ou pela manhã, embrulhado em papel-manteiga.");
  if (has.pasta_amendoim)
    steps.push("Porcione a pasta de amendoim em potinhos de 15 a 20 g. É o item que mais escapa do controle quando vai direto do vidro para o pão.");
  if (has.ovo_cozido)
    steps.push("Ovos cozidos duram até 5 dias na geladeira com a casca. Cozinhe uma dúzia de uma vez.");
  return steps;
};

/* =============================================================== UI DO PLANO */
PL.tab = "ciclo";
PL.dayId = "plantao";

UI.openPlan = function (tab) {
  PL.tab = tab || PL.tab;
  var p = $("#plan");
  p.classList.add("open");
  p.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  PL.render();
};
UI.closePlan = function () {
  var p = $("#plan");
  p.classList.remove("open");
  p.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
};

PL.render = function () {
  var host = $("#plan-body");
  host.innerHTML = "";
  host.scrollTop = 0;

  var seg = el("div", { class: "seg", role: "tablist" });
  [["ciclo", "Ciclo"], ["modelos", "Refeições"], ["preparo", "Preparo"]].forEach(function (t) {
    seg.appendChild(el("button", {
      class: PL.tab === t[0] ? "on" : "", text: t[1], role: "tab",
      "aria-selected": PL.tab === t[0] ? "true" : "false",
      onclick: function () { PL.tab = t[0]; PL.render(); }
    }));
  });
  host.appendChild(seg);

  if (PL.tab === "ciclo") PL.renderCycle(host);
  else if (PL.tab === "modelos") PL.renderModels(host);
  else PL.renderPrep(host);
};

/* ---------- aba 1: ciclo ---------- */
PL.renderCycle = function (host) {
  var cfg = PL.cfg();

  var head = el("div", { class: "card", style: "margin-top:12px" });
  head.appendChild(el("p", { class: "eyebrow", text: "Base do cálculo" }));
  head.appendChild(el("p", {
    class: "small muted", style: "margin-top:6px",
    text: "As metas abaixo partem de " + U.fmt(cfg.weight, 1) + " kg, " + cfg.height + " cm e " + cfg.age +
      " anos, com déficit de " + Math.round(cfg.deficit * 100) + "% sobre a manutenção estimada. São estimativas de fórmula, não medições: o ajuste real vem do peso médio, da cintura e do desempenho ao longo das semanas."
  }));
  head.appendChild(el("button", {
    class: "btn btn-soft btn-block", style: "margin-top:10px", text: "Ajustar peso, altura e déficit",
    onclick: PL.editCfg
  }));
  host.appendChild(head);

  var picker = el("div", { class: "chips-scroll", style: "margin-top:12px" });
  PL.DAYS.forEach(function (d) {
    picker.appendChild(el("button", {
      class: "chip" + (PL.dayId === d.id ? " on" : ""), text: d.label,
      onclick: function () { PL.dayId = d.id; PL.render(); }
    }));
  });
  host.appendChild(picker);

  var d = PL.day(PL.dayId), an = PL.dayAnalysis(PL.dayId), tg = an.targets;

  var card = el("div", { class: "card", style: "margin-top:10px" });
  card.appendChild(el("p", { class: "eyebrow", text: d.sub }));
  card.appendChild(el("h3", { class: "section-title", style: "margin:2px 0 4px", text: d.label }));
  card.appendChild(el("p", { class: "small muted", text: d.training }));

  var grid = el("div", { class: "grid-2", style: "margin-top:12px" });
  function stat(label, value, unit, sub) {
    var b = el("div", { class: "hstat" });
    b.appendChild(el("span", { class: "tiny muted", text: label }));
    b.appendChild(el("strong", { class: "num", text: value + (unit ? " " + unit : "") }));
    if (sub) b.appendChild(el("span", { class: "tiny mono muted", text: sub }));
    return b;
  }
  grid.appendChild(stat("Meta calórica", U.fmt(tg.kcal), "kcal", tg.kcalRange[0] + "–" + tg.kcalRange[1]));
  grid.appendChild(stat("Proteína", U.fmt(tg.protein), "g", tg.proteinRange[0] + "–" + tg.proteinRange[1] + " g"));
  grid.appendChild(stat("Carboidrato", U.fmt(tg.carb), "g", tg.carbRange[0] + "–" + tg.carbRange[1] + " g"));
  grid.appendChild(stat("Gordura", U.fmt(tg.fat), "g", tg.fatRange[0] + "–" + tg.fatRange[1] + " g"));
  card.appendChild(grid);
  card.appendChild(el("div", { class: "note info", style: "margin-top:10px", text: d.note }));
  host.appendChild(card);

  /* cardápio do dia */
  var menu = el("div", { class: "card", style: "margin-top:12px" });
  menu.appendChild(el("p", { class: "eyebrow", text: "Cardápio modelo do dia" }));
  an.slots.forEach(function (s, i) {
    var row = el("div", { class: "meal", style: i ? "margin-top:8px" : "margin-top:10px" });
    var rail = el("div", { class: "meal-rail" + (s.analysis && s.analysis.gl > 19 ? " med" : " low") });
    row.appendChild(rail);
    var body = el("div", { class: "meal-body" });
    var t = s.slot.marmita ? null : PL.tpl(s.slot.tpl);
    body.appendChild(el("div", { class: "meal-title", text: s.slot.label }));
    body.appendChild(el("div", {
      class: "meal-sub",
      text: s.slot.time + " · " + (s.slot.marmita
        ? (an.hasMarmita ? "Marmita do lote" + (s.slot.mult ? ", porção " + U.fmt(s.slot.mult, 2).replace(".", ",") + "×" : "") : "Nenhuma marmita selecionada")
        : t ? t.name : "—")
    }));
    if (s.analysis) {
      body.appendChild(el("div", {
        class: "meal-nums mono",
        text: U.fmt(s.analysis.kcal) + " kcal · " + U.fmt(s.analysis.protein) + " g P · CG " + U.fmt(s.analysis.gl)
      }));
    }
    row.appendChild(body);
    if (t) {
      row.appendChild(el("button", {
        class: "btn btn-ghost", text: "Usar", "aria-label": "Registrar " + t.name,
        onclick: function () { PL.registerTemplate(t, { mealType: t.mealType, context: d.context, time: s.slot.time }); }
      }));
    } else if (an.hasMarmita) {
      row.appendChild(el("button", {
        class: "btn btn-ghost", text: "Usar", "aria-label": "Escolher marmita",
        onclick: function () { PL.chooseMarmita(d.context, s.slot.time, s.slot.label.indexOf("Jantar") === 0 ? "jantar" : "almoco", s.slot.mult || 1); }
      }));
    }
    menu.appendChild(row);
  });

  var tot = an.totals;
  var cmp = el("div", { class: "card flat", style: "margin-top:12px" });
  cmp.appendChild(el("p", { class: "eyebrow", text: "Soma do cardápio × meta" }));
  cmp.appendChild(UI.estimateBar({
    value: tot.kcal, low: Math.round(tot.kcal * 0.92), high: Math.round(tot.kcal * 1.08),
    goal: tg.kcalRange, unit: "kcal", label: "Energia do dia"
  }));
  cmp.appendChild(UI.macroRow("Proteína", tot.protein, tg.proteinRange, "g"));
  cmp.appendChild(UI.macroRow("Carboidrato", tot.carb, tg.carbRange, "g"));
  cmp.appendChild(UI.macroRow("Gordura", tot.fat, tg.fatRange, "g"));
  cmp.appendChild(UI.macroRow("Fibra", tot.fiber, tg.fiber, "g"));
  cmp.appendChild(el("p", {
    class: "tiny muted mono", style: "margin-top:8px",
    text: "Carga glicêmica somada do dia: " + U.fmt(tot.gl) + " (" + tot.glClass.label + ")"
  }));
  menu.appendChild(cmp);

  var diff = tot.kcal - tg.kcal;
  menu.appendChild(el("div", {
    class: Math.abs(diff) <= 180 ? "note info" : "note warn", style: "margin-top:10px",
    text: Math.abs(diff) <= 180
      ? "O cardápio está dentro da faixa da meta. Diferenças de até cerca de 180 kcal são menores que o erro da própria estimativa."
      : (diff > 0
        ? "O cardápio está cerca de " + U.fmt(diff) + " kcal acima da meta deste dia. Reduza a porção de carboidrato de uma das marmitas ou troque a ceia por uma opção mais leve."
        : "O cardápio está cerca de " + U.fmt(Math.abs(diff)) + " kcal abaixo da meta deste dia. Acrescente uma fruta com pasta de amendoim ou aumente a porção de arroz da marmita.")
  }));
  if (tot.carb < tg.carbRange[0] * 0.92 && Math.abs(diff) <= 260) {
    menu.appendChild(el("div", {
      class: "note", style: "margin-top:8px",
      text: "O carboidrato fica abaixo do valor calculado porque o cardápio prioriza carga glicêmica baixa fora das janelas de treino. Se o desempenho no Legs ou na corrida cair, aumente primeiro a porção de arroz ou de batata doce da refeição mais próxima do treino."
    }));
  }
  host.appendChild(menu);

  var flex = el("div", { class: "card", style: "margin-top:12px" });
  flex.appendChild(el("p", { class: "eyebrow", text: "A parte flexível" }));
  flex.appendChild(el("p", {
    class: "small muted", style: "margin-top:6px",
    text: "A lógica é de 80 a 90% de alimentação estruturada. Sobre um ciclo de quatro dias, isso equivale a duas ou três refeições livres — restaurante, lanche ou sobremesa — sem que o dia inteiro saia do plano. Registre essas refeições normalmente, com o contexto \"Indulgente planejada\": elas fazem parte do modelo, não são uma falha dele."
  }));
  host.appendChild(flex);
};

PL.editCfg = function () {
  var c = PL.cfg();
  var box = el("div");
  function num(label, key, min, max, step, suffix) {
    var f = el("label", { class: "field" });
    f.appendChild(el("span", { text: label }));
    var i = el("input", { type: "number", value: String(c[key]), min: String(min), max: String(max), step: String(step), inputmode: "decimal" });
    i.addEventListener("change", function () { c[key] = U.clamp(parseFloat(i.value), min, max); });
    f.appendChild(i);
    if (suffix) f.appendChild(el("span", { class: "tiny muted", text: suffix }));
    box.appendChild(f);
    return i;
  }
  num("Peso atual (kg)", "weight", 40, 250, 0.1);
  num("Altura (cm)", "height", 130, 220, 1);
  num("Idade", "age", 14, 90, 1);

  var fd = el("label", { class: "field" });
  fd.appendChild(el("span", { text: "Déficit calórico" }));
  var sel = el("select");
  [[0, "Manutenção (0%)"], [0.10, "Leve (10%)"], [0.15, "Moderado (15%)"], [0.20, "Acentuado (20%)"]].forEach(function (o) {
    var op = el("option", { value: String(o[0]), text: o[1] });
    if (Math.abs(o[0] - c.deficit) < 0.01) op.selected = true;
    sel.appendChild(op);
  });
  sel.addEventListener("change", function () { c.deficit = parseFloat(sel.value); });
  fd.appendChild(sel);
  box.appendChild(fd);

  box.appendChild(el("div", {
    class: "note info", style: "margin-top:10px",
    text: "A proteína permanece entre " + c.proteinMin + " e " + c.proteinMax + " g por dia em qualquer configuração. O déficit atua sobre carboidrato e gordura."
  }));
  box.appendChild(el("button", {
    class: "btn btn-primary btn-block btn-lg", style: "margin-top:12px", text: "Salvar",
    onclick: function () {
      PL.saveCfg({ weight: c.weight, height: c.height, age: c.age, deficit: c.deficit });
      UI.closeSheet();
      PL.render();
      UI.toast("Metas do plano atualizadas.");
    }
  }));
  UI.openSheet("Base do cálculo", box);
};

PL.chooseMarmita = function (context, time, mealType, mult) {
  var list = PL.selectedMarmitas();
  if (!list.length) { PL.tab = "preparo"; PL.render(); return; }
  var box = el("div", { class: "card tight" });
  list.forEach(function (s) {
    var a = PL.analyze(s.tpl);
    var b = el("button", { class: "list-btn", onclick: function () { UI.closeSheet(); PL.registerTemplate(s.tpl, { context: context, time: time, mealType: mealType, mult: mult || 1 }); } });
    b.appendChild(el("span", { class: "cv" }, [
      el("b", { text: s.tpl.name }),
      el("span", { class: "mono", text: U.fmt(a.kcal * (mult || 1)) + " kcal · " + U.fmt(a.protein * (mult || 1)) + " g P · CG " + U.fmt(a.gl * (mult || 1)) })
    ]));
    b.appendChild(el("span", { class: "arrow", text: "›" }));
    box.appendChild(b);
  });
  UI.openSheet("Qual marmita você levou?", box);
};

  cv.appendChild(el("div", { class: "meal-title", text: t.name }));

PL.templateDetail = function (t) {
  var a = PL.analyze(t);

  }));
  var g = el("div", { class: "grid-2", style: "margin-top:10px" });
  [["Proteína", a.protein], ["Carboidrato", a.carb], ["Fibra", a.fiber], ["Gordura", a.fat]].forEach(function (p) {
    var b = el("div", { class: "hstat" });

    onclick: function () { UI.closeSheet(); PL.registerTemplate(t, {}); }

  }));
  shop.appendChild(el("button", {

  var sp = el("div", { class: "card", style: "margin-top:12px" });

  }));

PL.copyList = function (groups, list) {
  var lines = ["LISTA DE PREPARO — NUTRILOG", ""];
  (list || []).forEach(function (s) {
    var t = s.tpl || PL.tpl(s.id);
    if (t) lines.push(s.qty + "x " + t.name);
  });
  lines.push("");
  groups.forEach(function (g) {
    lines.push(g.cat.toUpperCase());
    g.items.forEach(function (it) {
      var amt = it.amount >= 1000 ? U.fmt(it.amount / 1000, 2) + " kg" : U.fmt(it.amount) + " g";
      if (it.units) amt += " (" + it.units + " " + it.unitLabel + ")";
      lines.push("- " + it.name + (it.label ? " " + it.label : "") + ": " + amt);
    });
    lines.push("");
  });
  var txt = lines.join("\n");
  function fallback() {
    try {
      var ta = document.createElement("textarea");
      ta.value = txt;
      ta.setAttribute("readonly", "readonly");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, txt.length);
      var okc = document.execCommand && document.execCommand("copy");
      document.body.removeChild(ta);
      UI.toast(okc ? "Lista copiada." : "Não foi possível copiar automaticamente.");
    } catch (e) { UI.toast("Não foi possível copiar automaticamente."); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { UI.toast("Lista copiada."); }, fallback);
  } else fallback();
};

    wrap.appendChild(box);

      } }));

/* ==================================================== 21. BACKUP */
App.exportData = function () {
  var payload = {
    app: "nutrilog",
    appVersion: APP_VERSION,
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    settings: App.settings,
    profile: App.profile,
    database: DB.data,
    meals: D.meals,
    days: Object.keys(D.days).map(function (k) { return D.days[k]; })
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var name = "nutrilog-backup-" + U.todayISO() + "-v" + SCHEMA_VERSION + ".json";
  var url = URL.createObjectURL(blob);
  var a = el("a", { href: url, download: name });
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  UI.toast("Backup gerado: " + name);
  return payload;                       // também disponível para a API pública
};

App.validateBackup = function (data) {
  if (!data || typeof data !== "object") return { ok: false, reason: "arquivo vazio ou ilegível" };
  if (data.app !== "nutrilog") return { ok: false, reason: "este arquivo não é um backup do NutriLog" };
  if (!Array.isArray(data.meals)) return { ok: false, reason: "lista de refeições ausente" };
  var bad = data.meals.filter(function (m) { return !m || !m.id || !m.date || !Array.isArray(m.items); });
  if (bad.length) return { ok: false, reason: bad.length + " refeição(ões) com estrutura inválida" };
  if (U.n(data.schemaVersion, 0) > SCHEMA_VERSION) return { ok: false, reason: "o backup é de uma versão mais nova do aplicativo" };
  return { ok: true };
};

App.importData = function (data, mode) {
  var v = App.validateBackup(data);
  if (!v.ok) return Promise.reject(new Error(v.reason));
  var chain = Promise.resolve();

  if (mode === "replace") {
    chain = chain.then(function () { return Promise.all([IDB.clear("meals"), IDB.clear("days")]); })
      .then(function () { D.meals = []; D.days = {}; });
  }
  chain = chain.then(function () {
    var existing = {};
    D.meals.forEach(function (m) { existing[m.id] = true; });
    var incoming = data.meals.filter(function (m) { return mode === "replace" || !existing[m.id]; });
    return incoming.reduce(function (p, m) {
      return p.then(function () {
        m.schemaVersion = m.schemaVersion || 1;
        D.meals.push(m);
        return IDB.put("meals", m);
      });
    }, Promise.resolve()).then(function () { return incoming.length; });
  });

  return chain.then(function (count) {
    (data.days || []).forEach(function (d) {
      if (d && d.date && (mode === "replace" || !D.days[d.date])) { D.days[d.date] = d; IDB.put("days", d); }
    });
    if (data.database && Array.isArray(data.database.foods)) {
      if (mode === "replace") { DB.data = data.database; DB.save(); }
      else {
        var have = {};
        DB.data.foods.forEach(function (f) { have[f.id] = 1; });
        data.database.foods.forEach(function (f) { if (!have[f.id]) DB.data.foods.push(f); });
        var haveR = {};
        DB.data.recipes.forEach(function (f) { haveR[f.id] = 1; });
        (data.database.recipes || []).forEach(function (f) { if (!haveR[f.id]) DB.data.recipes.push(f); });
        DB.save();
      }
    }
    if (mode === "replace") {
      if (data.settings) { App.settings = Object.assign({}, App.defaults.settings, data.settings); App.saveSettings(); }
      if (data.profile) { App.profile = Object.assign({}, App.defaults.profile, data.profile); App.saveProfile(); }
      UI.applyTheme();
    }
    D.sort();
    D.emit("nutrition:dataImported", { count: count, mode: mode });
    return count;
  });
};

UI.importFlow = function (file) {
  if (!file) return;
  var fr = new FileReader();
  fr.onerror = function () { UI.toast("Não foi possível ler o arquivo."); };
  fr.onload = function () {
    var data;
    try { data = JSON.parse(String(fr.result)); }
    catch (e) { return UI.toast("O arquivo não é um JSON válido."); }
    var v = App.validateBackup(data);
    var wrap = el("div", { class: "stack" });
    if (!v.ok) {
      wrap.appendChild(el("div", { class: "note warn", text: "Importação bloqueada: " + v.reason + "." }));
      wrap.appendChild(el("button", { class: "btn btn-ghost btn-block", text: "Fechar", onclick: UI.closeSheet }));
      return UI.openSheet("Backup inválido", wrap);
    }
    var known = {};
    D.meals.forEach(function (m) { known[m.id] = 1; });
    var novos = data.meals.filter(function (m) { return !known[m.id]; }).length;
    wrap.appendChild(el("div", { class: "card tight" }, [
      el("div", { class: "kv" }, [el("span", { text: "Gerado em" }), el("b", { text: String(data.exportedAt || "").slice(0, 10) || "—" })]),
      el("div", { class: "kv" }, [el("span", { text: "Refeições no arquivo" }), el("b", { text: String(data.meals.length) })]),
      el("div", { class: "kv" }, [el("span", { text: "Refeições novas para você" }), el("b", { text: String(novos) })]),
      el("div", { class: "kv" }, [el("span", { text: "Dias fechados" }), el("b", { text: String((data.days || []).length) })]),
      el("div", { class: "kv" }, [el("span", { text: "Alimentos no banco" }), el("b", { text: String(((data.database || {}).foods || []).length) })]),
      el("div", { class: "kv" }, [el("span", { text: "Receitas" }), el("b", { text: String(((data.database || {}).recipes || []).length) })])
    ]));
    wrap.appendChild(el("button", { class: "btn btn-primary btn-block", text: "Mesclar (mantém o que já existe)", onclick: U.once(function () {
      App.importData(data, "merge").then(function (n) { UI.closeSheet(); UI.toast(n + " refeição(ões) importadas."); UI.refresh(); })
        .catch(function (e) { UI.toast("Falha na importação: " + e.message); });
    }) }));
    wrap.appendChild(el("button", { class: "btn btn-danger btn-block", text: "Substituir tudo", onclick: function () {
      UI.confirm({ title: "Substituir todos os dados?", message: "Seus registros atuais serão apagados e trocados pelos do backup.", confirmLabel: "Substituir", danger: true, typeToConfirm: "SUBSTITUIR" })
        .then(function (ok) {
          if (!ok) return;
          App.importData(data, "replace").then(function (n) { UI.toast(n + " refeição(ões) restauradas."); UI.refresh(); })
            .catch(function (e) { UI.toast("Falha na importação: " + e.message); });
        });
    } }));
    wrap.appendChild(el("button", { class: "btn btn-ghost btn-block", text: "Cancelar", onclick: UI.closeSheet }));
    UI.openSheet("Prévia do backup", wrap);
  };
  fr.readAsText(file);
};

UI.wipeData = function () {
  UI.confirm({
    title: "Apagar todos os dados?",
    message: "Refeições, dias fechados, receitas, alimentos personalizados e preferências serão removidos deste aparelho.",

App.getDailySummary = function (date) {

  var meals = D.byDate(d);
  var t = C.day(meals);
  return {
    date: d, closed: D.isClosed(d),
    totals: {
      kcal: U.round(t.kcal, 1), protein: U.round(t.protein, 1), carb: U.round(t.carb, 1),
      availCarb: U.round(t.availCarb, 1), fiber: U.round(t.fiber, 1), fat: U.round(t.fat, 1),
      gl: U.round(t.gl, 1), giWeighted: t.giWeighted
    },
    range: { kcalLow: U.round(t.low.kcal, 1), kcalHigh: U.round(t.high.kcal, 1) },
    mealCount: t.mealCount, contexts: t.contexts, goals: App.profile.goals
  };
};
App.getWeeklySummary = function (dateInWeek) {
  var from = U.weekStart(dateInWeek || U.todayISO());
  return D.aggregate(from, U.addDays(from, 6));
};
App.getMonthlySummary = function (dateInMonth) {
  var iso = dateInMonth || U.todayISO();
  var from = U.monthStart(iso);
  return D.aggregate(from, U.addDays(from, U.daysInMonth(iso) - 1));
};
App.openRegisterMeal = function (opts) {

App.setExternalContext = function (context) {

  if (!valid) return false;
  App.externalContext = context;
  if (UI.editor && UI.editor.meal) { UI.editor.meal.context = context; FL.renderEditor(); }

};

  });

  $("#editor-extra").addEventListener("click", function () { FL.editorExtras(); });

  $("#picker-search").addEventListener("input", U.debounce(function (e) { UI.renderPickerResults(e.target.value); }, 220));
  $("#report-seg").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;

  });

  $("#input-camera").addEventListener("change", function (e) { FL.onFileChosen(e.target.files && e.target.files[0]); });
  $("#input-gallery").addEventListener("change", function (e) { FL.onFileChosen(e.target.files && e.target.files[0]); });
  $("#input-import").addEventListener("change", function (e) { UI.importFlow(e.target.files && e.target.files[0]); });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if ($("#picker").classList.contains("open")) UI.closePicker();
    else if ($("#sheet").classList.contains("open")) UI.closeSheet();
    else if ($("#editor").classList.contains("open")) UI.confirmDiscard();
    else if ($("#plan").classList.contains("open")) UI.closePlan();
  });

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function () { if (App.settings.theme === "auto") UI.applyTheme(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
  window.addEventListener("resize", U.debounce(function () { Ch.redrawAll(); }, 200));
  window.addEventListener("online", function () { UI.toast("Conexão restabelecida."); });
  window.addEventListener("offline", function () { UI.toast("Você está offline. O aplicativo continua funcionando: os dados ficam no aparelho."); });
  window.addEventListener("error", function (ev) { console.error("[NutriLog]", ev.message); });
}

UI.confirmDiscard = function () {
  var st = UI.editor;
  if (!st) return FL.closeEditor();
  if (!st.meal.items.length) return FL.closeEditor();
  UI.confirm({ title: "Descartar esta refeição?", message: "As alterações feitas aqui não serão salvas.", confirmLabel: "Descartar", danger: true })
    .then(function (ok) { if (ok) FL.closeEditor(); });
};

App.boot = function () {
  App.loadConfig();
  DB.load();
  UI.applyTheme();
  bindGlobalEvents();
  D.load().then(function () {
    UI.setTab(App.settings.lastTab && $("#view-" + App.settings.lastTab) ? App.settings.lastTab : "hoje");
    if (!App.settings.firstRunDone) {
      App.settings.firstRunDone = true;
      App.saveSettings();
      setTimeout(function () {
        var wrap = el("div", { class: "stack" });
        wrap.appendChild(el("p", { class: "small muted", text: "O NutriLog estima os valores da sua refeição e acompanha a evolução ao longo dos dias. Três coisas para saber antes de começar:" }));
        var ul = el("ul", { class: "tips plain" });
        [
          "Tudo aqui é estimativa com faixa provável. Nenhum número é apresentado como medição exata.",
          "Você decide se a refeição é consulta (só análise) ou consumida (entra no diário).",
          "Os dados ficam no seu aparelho. Exporte um backup de vez em quando."
        ].forEach(function (x, i) { ul.appendChild(el("li", {}, [el("span", { class: "n", text: String(i + 1) }), el("span", { text: x })])); });
        wrap.appendChild(ul);
        wrap.appendChild(el("button", { class: "btn btn-primary btn-block", text: "Começar", onclick: UI.closeSheet }));
        UI.openSheet("Bem-vindo ao NutriLog", wrap);
      }, 600);
    }
  });
};

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", App.boot);
else App.boot();

})();

</script>
</body>
</html>

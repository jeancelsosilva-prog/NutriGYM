<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B100E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="NutriLog — analista nutricional visual e diário alimentar com estimativas honestas, carga glicêmica e relatórios.">
<title>NutriLog — Analista Nutricional</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7C55'/%3E%3Cpath d='M8 22c0-6 4-10 10-11-1 7-4 10-10 11z' fill='%23A8C11F'/%3E%3Cpath d='M8 24c3-4 7-7 12-9' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   NUTRILOG — DESIGN TOKENS
   Direção: "jardim clínico". Verde pinho profundo + citrino de
   dados. Números em fonte arredondada do sistema (iOS), medidas
   e faixas em monoespaçada — a incerteza é sempre visível.
   ============================================================ */
:root{
  --bg:#F2F5F1;
  --bg-grad:radial-gradient(120% 80% at 100% 0%, #E7F0E6 0%, #F2F5F1 55%);
  --surface:#FFFFFF;
  --surface-2:#EAEFE8;
  --surface-3:#DFE7DC;
  --line:#D8E1D5;
  --line-strong:#BFCDBA;
  --ink:#0F1A15;
  --muted:#5A6B62;
  --faint:#8A9A91;
  --accent:#0E7C55;
  --accent-ink:#0A5C3F;
  --accent-soft:#DCEFE5;
  --citrine:#7E9410;
  --citrine-soft:#EDF3D2;
  --warn:#9A6A12;
  --warn-soft:#F7EDD6;
  --bad:#A8452F;
  --bad-soft:#F7E3DD;
  --on-accent:#FFFFFF;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(15,26,21,.05), 0 10px 28px rgba(15,26,21,.06);
  --shadow-lift:0 6px 16px rgba(15,26,21,.10), 0 18px 44px rgba(15,26,21,.12);
  --nav-h:64px;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-data:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0B100E;
  --bg-grad:radial-gradient(120% 80% at 100% 0%, #12201A 0%, #0B100E 55%);
  --surface:#131916;
  --surface-2:#1B231E;
  --surface-3:#232D27;
  --line:#232D27;
  --line-strong:#33403A;
  --ink:#E9F1EB;
  --muted:#96A79D;
  --faint:#6F7F76;
  --accent:#45D19A;
  --accent-ink:#8BE9C1;
  --accent-soft:#123024;
  --citrine:#B9D137;
  --citrine-soft:#232B12;
  --warn:#D8A64A;
  --warn-soft:#2C2415;
  --bad:#E58B76;
  --bad-soft:#2E1A15;
  --on-accent:#05231A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --shadow-lift:0 6px 16px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);
  background:var(--bg);
  background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--ink);
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums;font-size:.82em}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- layout ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.view{display:none;padding-top:calc(env(safe-area-inset-top) + 10px);animation:fade .18s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:18px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* ---------- typography ---------- */
h1{font-family:var(--font-display);font-size:1.55rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h2{font-family:var(--font-display);font-size:1.12rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:.98rem;font-weight:650}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}

/* ---------- card ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card.tight{padding:13px}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:650;font-size:.95rem;border:1px solid transparent;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-soft{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--muted);min-height:40px;padding:0 10px}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-icon{min-height:44px;min-width:44px;padding:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.btn-lg{min-height:56px;font-size:1rem}

/* ---------- chips & segmented ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.78rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--accent-soft);color:var(--accent-ink)}
.chip.cit{background:var(--citrine-soft);color:var(--citrine)}
button.chip{cursor:pointer;min-height:36px}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips-scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:650;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.mode button[aria-pressed="true"][data-mode="consumed"]{background:var(--accent);color:var(--on-accent)}
.seg.mode button[aria-pressed="true"][data-mode="query"]{background:var(--citrine);color:#10160A}

/* ---------- forms ---------- */
label.field{display:block}
.field>span{display:block;font-size:.78rem;font-weight:650;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
  width:100%;min-height:48px;padding:12px 14px;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:13px;font-size:1rem;appearance:none}
textarea{min-height:84px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:40px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.toggle{position:relative;width:52px;height:31px;border-radius:999px;background:var(--surface-3);flex:none;transition:background .18s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(21px)}

/* ---------- estimate bar (elemento assinatura) ---------- */
.est{--lo:20%;--hi:80%;--mid:50%}
.est-track{position:relative;height:8px;border-radius:999px;background:var(--surface-2);overflow:visible;margin:7px 0 5px}
.est-range{position:absolute;top:0;bottom:0;left:var(--lo);right:calc(100% - var(--hi));border-radius:999px;background:var(--accent-soft)}
.est-range.cit{background:var(--citrine-soft)}
.est-tick{position:absolute;top:-4px;left:var(--mid);width:3px;height:16px;border-radius:2px;background:var(--accent);transform:translateX(-1.5px)}
.est-tick.cit{background:var(--citrine)}
.est-goal{position:absolute;top:-3px;bottom:-3px;left:var(--glo);right:calc(100% - var(--ghi));border:1.5px dashed var(--line-strong);border-radius:8px;pointer-events:none}
.est-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint)}

/* confiança: trilho de 3 segmentos */
.conf{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.conf i{width:4px;height:11px;border-radius:1px;background:var(--surface-3);display:block}
.conf[data-level="alta"] i{background:var(--accent)}
.conf[data-level="media"] i:nth-child(-n+2){background:var(--warn)}
.conf[data-level="baixa"] i:nth-child(1){background:var(--bad)}

/* ---------- anel de calorias ---------- */
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{width:116px;height:116px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .ring-c{fill:none;stroke-linecap:round}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.ring .goal{stroke:var(--line-strong);stroke-width:2;stroke-dasharray:2 4}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .v{font-family:var(--font-display);font-size:1.7rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring-center .l{font-size:.68rem;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}

/* ---------- barras de macro ---------- */
.macro{padding:11px 0}
.macro+.macro{border-top:1px solid var(--line)}
.macro-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.macro-name{font-size:.86rem;font-weight:650}
.macro-val{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.bar{position:relative;height:9px;border-radius:999px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--accent);transition:width .45s ease}
.bar>b{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.08);border-left:1.5px solid var(--line-strong);border-right:1.5px solid var(--line-strong)}
[data-theme="dark"] .bar>b{background:rgba(255,255,255,.06)}
.bar.warn>i{background:var(--warn)}
.bar.bad>i{background:var(--bad)}
.bar.cit>i{background:var(--citrine)}

/* ---------- lista de refeições ---------- */
.meal{display:flex;gap:12px;padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);text-align:left;width:100%}
.meal-rail{width:4px;border-radius:999px;background:var(--accent);flex:none}
.meal-rail.query{background:var(--citrine)}
.meal-rail.med{background:var(--warn)}
.meal-rail.low{background:var(--bad)}
.meal-body{flex:1;min-width:0}
.meal-title{font-weight:650;font-size:.95rem;display:flex;align-items:center;gap:7px}
.meal-sub{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal-nums{display:flex;gap:12px;margin-top:7px;font-size:.78rem;color:var(--muted)}
.meal-nums b{font-family:var(--font-display);color:var(--ink);font-weight:700}

/* ---------- item editável ---------- */
.item{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--surface)}
.item+.item{margin-top:10px}
.stepper{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:13px;padding:4px}
.stepper button{width:42px;height:42px;border-radius:10px;background:var(--surface);font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.stepper input{width:74px;min-height:42px;text-align:center;border:none;background:transparent;font-family:var(--font-display);font-weight:700;padding:0}
.stepper input:focus{box-shadow:none;outline:2px solid var(--accent);border-radius:8px}

/* ---------- navegação inferior ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:.66rem;font-weight:650;letter-spacing:.01em}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg{stroke-width:2.1}

/* ---------- sheet / painel ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,16,12,.45);backdrop-filter:blur(2px);z-index:96;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:92vh;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet-panel{background:var(--surface);border-radius:26px 26px 0 0;box-shadow:var(--shadow-lift);padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grabber{width:38px;height:5px;border-radius:99px;background:var(--line-strong);margin:6px auto 12px}
.sheet-title{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-bottom:4px}
.fs{position:fixed;inset:0;z-index:95;background:var(--bg);background-image:var(--bg-grad);display:none;flex-direction:column}
.fs.open{display:flex}
.fs-head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid var(--line);background:var(--surface);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px)}
.fs-head h2{flex:1;text-align:center;font-size:1.02rem}
.fs-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px}
.fs-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}

/* ---------- toast ---------- */
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);z-index:120;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:15px;padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lift);transform:translateY(140%);transition:transform .25s cubic-bezier(.32,.72,0,1);font-size:.88rem}
.toast.show{transform:none}
.toast button{color:var(--accent-ink);font-weight:700;font-size:.86rem;white-space:nowrap}
[data-theme="light"] .toast button{color:#8BE9C1}

/* ---------- diversos ---------- */
.divider{height:1px;background:var(--line);margin:14px 0}
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.empty svg{width:44px;height:44px;stroke:var(--line-strong);fill:none;stroke-width:1.4;margin-bottom:10px}
.empty p{font-size:.9rem;margin-bottom:14px}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:11px 13px;font-size:.82rem;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent-ink)}
.badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.query{background:var(--citrine-soft);color:var(--citrine)}
.badge.demo{background:var(--warn-soft);color:var(--warn)}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;min-height:56px}
.list-btn+.list-btn{border-top:1px solid var(--line)}
.list-btn .ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.list-btn .ic svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.list-btn .cv{flex:1;min-width:0}
.list-btn .cv b{display:block;font-size:.93rem;font-weight:650}
.list-btn .cv span{display:block;font-size:.78rem;color:var(--muted)}
.arrow{color:var(--faint);font-size:1.1rem}
canvas{display:block;width:100%;touch-action:pan-y}
.photo-prev{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.photo-prev img{display:block;width:100%;max-height:260px;object-fit:cover}
.photo-prev .ov{position:absolute;left:8px;bottom:8px;display:flex;gap:6px}
.score{font-family:var(--font-display);font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.tips li{display:flex;gap:9px;padding:9px 0;font-size:.88rem}
.tips li+li{border-top:1px solid var(--line)}
.tips .n{width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
ul.plain{list-style:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:.87rem}
.kv+.kv{border-top:1px solid var(--line)}
.kv b{font-family:var(--font-display);font-weight:700}
.hstat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px}
.hstat .l{font-size:.7rem;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.hstat .v{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-top:2px}
.food-row{display:flex;align-items:center;gap:10px;padding:12px 4px;width:100%;text-align:left;min-height:56px}
.food-row+.food-row{border-top:1px solid var(--line)}
.food-row .fv{flex:1;min-width:0}
.food-row .fv b{font-size:.9rem;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.food-row .fv span{font-size:.76rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
@media (min-width:600px){ h1{font-size:1.7rem} }
</style>
</head>
<body>

<!-- ===================== TELA: HOJE ===================== -->
<section class="view active" id="view-hoje" role="region" aria-label="Hoje">
  <div class="wrap">
    <header class="row between" style="margin:6px 0 14px">
      <div>

<script>
/* ============================================================================

(function () {
"use strict";

var App = {};
window.NutriLogApp = App;

/* ---------------------------------------------------------------- 1. UTIL */
var U = App.util = {};

U.$ = function (sel, root) { return (root || document).querySelector(sel); };
U.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

U.el = function (tag, attrs, children) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k.slice(0, 5) === "data-" || k.slice(0, 5) === "aria-") n.setAttribute(k, v);
    else if (k in n) { try { n[k] = v; } catch (e) { n.setAttribute(k, v); } }

    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  });

};

U.uid = function (prefix) {
  var r = "";
  try {
    var a = new Uint8Array(8);
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (var i = 0; i < a.length; i++) r += a[i].toString(36);

  return (prefix || "id") + "_" + Date.now().toString(36) + "_" + r.slice(0, 8);
};

/* Números seguros: nunca NaN, nunca Infinity, nunca negativo quando proibido */
U.n = function (v, fallback) {
  var x = typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
  if (!isFinite(x)) return fallback === undefined ? 0 : fallback;
  return x;
};
U.pos = function (v, fallback) { return Math.max(0, U.n(v, fallback)); };
U.clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, U.n(v, lo))); };
U.round = function (v, d) { var m = Math.pow(10, d || 0); return Math.round(U.n(v) * m) / m; };

/* Datas — sempre em horário local, formato ISO curto YYYY-MM-DD */
U.todayISO = function () { return U.toISO(new Date()); };
U.toISO = function (d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
U.fromISO = function (iso) {
  var p = String(iso || "").split("-");
  return new Date(U.n(p[0], 2024), U.n(p[1], 1) - 1, U.n(p[2], 1), 12, 0, 0);
};
U.addDays = function (iso, days) {
  var d = U.fromISO(iso); d.setDate(d.getDate() + days); return U.toISO(d);
};
U.nowHM = function () {
  var d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
};
U.WEEKDAYS = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
U.WEEKDAYS_S = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
U.MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
U.dateLong = function (iso) {
  var d = U.fromISO(iso);
  return U.WEEKDAYS[d.getDay()] + ", " + d.getDate() + " de " + U.MONTHS[d.getMonth()];
};
U.dateShort = function (iso) {
  var d = U.fromISO(iso);
  return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
};
U.dateRelative = function (iso) {
  var t = U.todayISO();
  if (iso === t) return "Hoje";
  if (iso === U.addDays(t, -1)) return "Ontem";
  if (iso === U.addDays(t, 1)) return "Amanhã";
  return U.dateLong(iso).replace(/^\w/, function (c) { return c.toUpperCase(); });
};
/* Semana começando na segunda-feira */
U.weekStart = function (iso) {
  var d = U.fromISO(iso), dow = (d.getDay() + 6) % 7;
  return U.addDays(iso, -dow);
};
U.monthStart = function (iso) { return iso.slice(0, 7) + "-01"; };
U.daysInMonth = function (iso) { var d = U.fromISO(iso); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };

U.debounce = function (fn, ms) {
  var t = null;
  return function () {
    var self = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(self, args); }, ms || 200);
  };
};

/* Trava anti clique-duplo em ações destrutivas ou de gravação */
U.once = function (fn, ms) {
  var busy = false;
  return function () {
    if (busy) return;
    busy = true;
    var r;
    try { r = fn.apply(this, arguments); } finally {
      setTimeout(function () { busy = false; }, ms || 700);
    }
    return r;
  };
};

U.slug = function (s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
};
U.norm = function (s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
};
U.esc = function (s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
};

/* ------------------------------------------------------- 2. ARMAZENAMENTO */
/* localStorage: apenas configurações, perfil, banco de alimentos e estado.
   IndexedDB: refeições e dias consolidados (volume maior).                */

var KEYS = App.KEYS = {
  settings: "nutrilog_settings_v1",
  profile: "nutrilog_profile_v1",
  database: "nutrilog_database_v1",
  state: "nutrilog_state_v1"
};
var SCHEMA_VERSION = App.SCHEMA_VERSION = 1;
var APP_VERSION = App.APP_VERSION = "1.0.0";

var LS = App.ls = {
  available: (function () {
    try { var k = "__nl_test__"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  })(),
  memory: {},
  get: function (key, fallback) {
    try {
      var raw = LS.available ? localStorage.getItem(key) : LS.memory[key];
      if (!raw) return fallback;
      var v = JSON.parse(raw);
      return v === null || v === undefined ? fallback : v;
    } catch (e) {
      console.warn("[NutriLog] leitura falhou:", key, e);
      return fallback;
    }
  },
  set: function (key, value) {
    var raw = JSON.stringify(value);
    try {
      if (LS.available) localStorage.setItem(key, raw); else LS.memory[key] = raw;
      return true;
    } catch (e) {
      LS.memory[key] = raw;
      console.warn("[NutriLog] gravação falhou:", key, e);
      if (App.ui && App.ui.toast) App.ui.toast("Não foi possível salvar no dispositivo. Exporte um backup.");
      return false;
    }
  },
  del: function (key) {
    try { if (LS.available) localStorage.removeItem(key); } catch (e) {}
    delete LS.memory[key];
  }
};

/* --- IndexedDB com fallback transparente para localStorage --- */
var IDB = App.idb = {
  name: "nutrilog_db_v1",
  db: null,
  broken: false,
  open: function () {
    return new Promise(function (resolve) {
      if (IDB.db) return resolve(IDB.db);
      if (!window.indexedDB) { IDB.broken = true; return resolve(null); }
      var req;
      try { req = indexedDB.open(IDB.name, 1); }
      catch (e) { IDB.broken = true; return resolve(null); }
      req.onupgradeneeded = function (ev) {
        var db = ev.target.result;
        if (!db.objectStoreNames.contains("meals")) {
          var s = db.createObjectStore("meals", { keyPath: "id" });
          s.createIndex("date", "date", { unique: false });
        }
        if (!db.objectStoreNames.contains("days")) db.createObjectStore("days", { keyPath: "date" });
      };
      req.onsuccess = function () { IDB.db = req.result; resolve(IDB.db); };
      req.onerror = function () { IDB.broken = true; console.warn("[NutriLog] IndexedDB indisponível, usando armazenamento local."); resolve(null); };
      req.onblocked = function () { IDB.broken = true; resolve(null); };
    });
  },
  fallbackKey: function (store) { return "nutrilog_fallback_" + store + "_v1"; },
  all: function (store) {
    return IDB.open().then(function (db) {
      if (!db) return LS.get(IDB.fallbackKey(store), []);
      return new Promise(function (resolve) {
        try {
          var tx = db.transaction(store, "readonly"), req = tx.objectStore(store).getAll();
          req.onsuccess = function () { resolve(req.result || []); };
          req.onerror = function () { resolve(LS.get(IDB.fallbackKey(store), [])); };
        } catch (e) { resolve(LS.get(IDB.fallbackKey(store), [])); }
      });
    });
  },
  put: function (store, obj) {
    return IDB.open().then(function (db) {
      if (!db) {
        var arr = LS.get(IDB.fallbackKey(store), []);
        var key = store === "days" ? "date" : "id";
        var i = arr.findIndex(function (x) { return x[key] === obj[key]; });
        if (i >= 0) arr[i] = obj; else arr.push(obj);
        LS.set(IDB.fallbackKey(store), arr);
        return obj;
      }
      return new Promise(function (resolve, reject) {
        try {
          var tx = db.transaction(store, "readwrite");
          tx.objectStore(store).put(obj);
          tx.oncomplete = function () { resolve(obj); };
          tx.onerror = function () { reject(tx.error); };
        } catch (e) { reject(e); }
      });
    });
  },
  del: function (store, key) {
    return IDB.open().then(function (db) {
      if (!db) {
        var kf = store === "days" ? "date" : "id";
        var arr = LS.get(IDB.fallbackKey(store), []).filter(function (x) { return x[kf] !== key; });
        LS.set(IDB.fallbackKey(store), arr);
        return true;
      }
      return new Promise(function (resolve, reject) {
        try {
          var tx = db.transaction(store, "readwrite");
          tx.objectStore(store).delete(key);
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { reject(tx.error); };
        } catch (e) { reject(e); }
      });
    });
  },
  clear: function (store) {
    return IDB.open().then(function (db) {
      if (!db) { LS.set(IDB.fallbackKey(store), []); return true; }
      return new Promise(function (resolve, reject) {
        try {
          var tx = db.transaction(store, "readwrite");
          tx.objectStore(store).clear();
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { reject(tx.error); };
        } catch (e) { reject(e); }
      });
    });
  }
};

/* ------------------------------------------------------- 3. CONFIGURAÇÃO */
App.defaults = {
  settings: {
    schemaVersion: SCHEMA_VERSION,
    theme: "auto",              // auto | light | dark
    defaultMode: "consumed",    // consumed | query
    keepPhotos: false,
    aiEndpoint: "",             // apenas URL — nunca chave de API
    lastTab: "hoje",
    firstRunDone: false
  },
  profile: {
    schemaVersion: SCHEMA_VERSION,
    name: "",
    goals: {

App.profile = null;

App.loadConfig = function () {

  var p = LS.get(KEYS.profile, {});

};
App.saveSettings = function () { App.settings.schemaVersion = SCHEMA_VERSION; LS.set(KEYS.settings, App.settings); };
App.saveProfile = function () { App.profile.schemaVersion = SCHEMA_VERSION; LS.set(KEYS.profile, App.profile); };

/* Migração de esquema — nunca destrói registros existentes */
App.migrate = function () {
  var from = U.n(App.settings.schemaVersion, 1);
  if (from < SCHEMA_VERSION) {
    // Migrações futuras entram aqui em cascata (if from < 2 { ... from = 2 } ...)
    App.settings.schemaVersion = SCHEMA_VERSION;
    App.saveSettings();
    console.info("[NutriLog] esquema migrado de v" + from + " para v" + SCHEMA_VERSION);
  }
};

      // Adiciona alimentos novos do seed sem sobrescrever edições do usuário
      var have = {};
      DB.data.foods.forEach(function (f) { have[f.id] = true; });
      var added = 0;
      App.SEED_FOODS.forEach(function (f) {
        if (!have[f.id]) { DB.data.foods.push(JSON.parse(JSON.stringify(f))); added++; }
      });
      if (added) DB.save();
    }
    return DB.data;
  },
  save: function () {
    DB.data.schemaVersion = SCHEMA_VERSION;
    return LS.set(KEYS.database, DB.data);
  },
  foods: function () { return DB.data.foods; },
  recipes: function () { return DB.data.recipes; },
  get: function (id) {
    var f = DB.data.foods.filter(function (x) { return x.id === id; })[0];
    if (f) return f;
    var r = DB.data.recipes.filter(function (x) { return x.id === id; })[0];
    return r ? DB.recipeAsFood(r) : null;
  },
  upsert: function (food) {
    var i = DB.data.foods.findIndex(function (x) { return x.id === food.id; });
    if (i >= 0) DB.data.foods[i] = food; else DB.data.foods.push(food);
    DB.save();
    return food;
  },
  remove: function (id) {
    DB.data.foods = DB.data.foods.filter(function (x) { return x.id !== id; });
    DB.save();
  },
  resetToSeed: function () {
    var custom = DB.data.foods.filter(function (f) { return !f.generic; });
    DB.data.foods = JSON.parse(JSON.stringify(App.SEED_FOODS)).concat(custom);
    DB.save();
  },
  search: function (q, cat) {
    var list = DB.data.foods.concat(DB.data.recipes.map(DB.recipeAsFood));
    var nq = U.norm(q);
    if (cat && cat !== "todos") list = list.filter(function (f) { return f.cat === cat; });
    if (!nq) return list.sort(function (a, b) { return a.name.localeCompare(b.name, "pt-BR"); }).slice(0, 80);
    var scored = [];
    list.forEach(function (f) {
      var n = U.norm(f.name), score = -1;
      if (n === nq) score = 100;
      else if (n.indexOf(nq) === 0) score = 80;
      else if (n.indexOf(nq) > -1) score = 60;
      else if ((f.aliases || []).some(function (a) { return U.norm(a).indexOf(nq) > -1; })) score = 50;
      if (score > 0) scored.push({ f: f, s: score });
    });
    return scored.sort(function (a, b) { return b.s - a.s || a.f.name.localeCompare(b.f.name, "pt-BR"); })
      .map(function (x) { return x.f; }).slice(0, 60);
  },
  /* Receita → alimento virtual, com valores por 100 g calculados dos ingredientes */
  recipeAsFood: function (r) {
    var per = App.calc.recipePer100(r);
    return {
      id: r.id, name: r.name, aliases: r.aliases || [], cat: "receitas", unit: "g",
      per100: per.per100, gi: per.gi, giRange: per.giRange, conf: per.conf,
      up: false, fried: false,
      portion: U.pos(r.portionWeight, 100) || 100,
      household: r.servings > 0 && r.portionWeight > 0 ? [{ label: "porção", g: U.round(r.portionWeight, 0) }] : [],
      note: r.note || "", source: "Calculado a partir dos ingredientes da receita",
      generic: false, isRecipe: true, recipe: r
    };
  },
  upsertRecipe: function (r) {
    var i = DB.data.recipes.findIndex(function (x) { return x.id === r.id; });
    if (i >= 0) DB.data.recipes[i] = r; else DB.data.recipes.push(r);
    DB.save();
    return r;
  },
  removeRecipe: function (id) {
    DB.data.recipes = DB.data.recipes.filter(function (x) { return x.id !== id; });
    DB.save();
  }
};
/* ============================================================ 7. MOTOR MATEMÁTICO
   Determinístico. Nenhum valor é inventado em tempo de execução: tudo vem do
   snapshot nutricional gravado no próprio item da refeição.
   ============================================================================ */
var C = App.calc = {};

C.ZERO = function () {
  return { kcal: 0, protein: 0, carb: 0, fiber: 0, fat: 0, availCarb: 0, gl: 0, sat: 0, sodium: 0 };
};

/* Cria o item de refeição a partir de um alimento do banco (snapshot imutável) */
C.itemFromFood = function (food, grams) {
  var g = U.clamp(grams === undefined ? food.portion : grams, 0, 5000);
  var it = {
    uid: U.uid("it"),
    foodId: food.id,
    name: food.name,
    prep: food.prepDefault || "",
    unit: food.unit || "g",
    grams: U.round(g, 1),
    rangeGrams: null,
    conf: food.conf || "media",
    household: (food.household || []).slice(),
    per100: Object.assign({ sat: null, sodium: null }, food.per100),
    gi: U.pos(food.gi),
    giRange: (food.giRange || [0, 0]).slice(),
    up: !!food.up,
    fried: !!food.fried,
    generic: food.generic !== false,
    source: food.source || "",
    note: food.note || ""
  };
  it.rangeGrams = C.defaultRange(it.grams, it.conf);
  return it;
};

C.defaultRange = function (grams, conf) {
  var s = App.CONF_SPREAD[conf] || 0.28;
  return [U.round(Math.max(0, grams * (1 - s)), 0), U.round(grams * (1 + s), 0)];
};

/* Nutrientes de um item, para uma quantidade em gramas */
C.atGrams = function (item, grams) {
  var f = U.pos(grams) / 100;
  var p = item.per100 || {};
  var carb = U.pos(p.carb) * f;
  var fiber = U.pos(p.fiber) * f;
  var avail = Math.max(0, carb - fiber);          // nunca negativo
  var gi = U.pos(item.gi);
  return {
    kcal: U.pos(p.kcal) * f,
    protein: U.pos(p.protein) * f,
    carb: carb,
    fiber: fiber,
    fat: U.pos(p.fat) * f,
    availCarb: avail,
    gl: gi * avail / 100,                          // CG = IG × carbo disponível ÷ 100
    sat: p.sat === null || p.sat === undefined ? 0 : U.pos(p.sat) * f,
    sodium: p.sodium === null || p.sodium === undefined ? 0 : U.pos(p.sodium) * f
  };
};

/* Item completo: valor central + faixa provável */
C.item = function (item, leftoverPct) {
  var keep = 1 - U.clamp(leftoverPct || 0, 0, 90) / 100;
  var g = U.pos(item.grams) * keep;
  var r = item.rangeGrams && item.rangeGrams.length === 2 ? item.rangeGrams : C.defaultRange(item.grams, item.conf);
  var mid = C.atGrams(item, g);
  mid.grams = g;
  mid.low = C.atGrams(item, U.pos(r[0]) * keep);
  mid.high = C.atGrams(item, U.pos(r[1]) * keep);
  mid.lowGrams = U.pos(r[0]) * keep;
  mid.highGrams = U.pos(r[1]) * keep;
  return mid;
};

C.add = function (target, src) {
  ["kcal", "protein", "carb", "fiber", "fat", "availCarb", "gl", "sat", "sodium"].forEach(function (k) {
    target[k] = U.pos(target[k]) + U.pos(src[k]);
  });
  return target;
};

/* Totais de uma refeição, com faixa, IG ponderado e fontes de incerteza */
C.meal = function (meal) {
  var t = C.ZERO(), lo = C.ZERO(), hi = C.ZERO();
  var giNum = 0, giDen = 0, items = meal.items || [];
  var confRank = { alta: 3, media: 2, baixa: 1 }, worst = 3;

  items.forEach(function (it) {
    var r = C.item(it, meal.leftoverPct);
    C.add(t, r); C.add(lo, r.low); C.add(hi, r.high);
    giNum += U.pos(it.gi) * r.availCarb;
    giDen += r.availCarb;
    worst = Math.min(worst, confRank[it.conf] || 2);
  });

  t.giWeighted = giDen >= 5 ? U.round(giNum / giDen, 0) : null;   // sem carbo suficiente → não aplicável
  t.glClass = C.glClass(t.gl);
  t.low = lo; t.high = hi;
  t.itemCount = items.length;

  // Confiança da refeição: pela largura relativa da faixa calórica, limitada
  // pelo pior item. Uma faixa estreita não pode "curar" um item de baixa confiança.
  var width = t.kcal > 0 ? (hi.kcal - lo.kcal) / (2 * t.kcal) : 0;
  var byWidth = width <= 0.18 ? 3 : (width <= 0.33 ? 2 : 1);
  var level = Math.min(byWidth, worst);
  t.conf = level === 3 ? "alta" : (level === 2 ? "media" : "baixa");
  t.uncertainties = C.uncertainties(meal);
  return t;
};

C.uncertainties = function (meal) {
  var out = [], items = meal.items || [];
  if (!items.length) return out;
  var hasFat = items.some(function (i) { return i.per100 && U.pos(i.per100.fat) > 40; });
  var cooked = items.some(function (i) { return /cozid|refogad|grelhad|assad|frit/i.test(i.name + " " + (i.prep || "")); });
  if (items.some(function (i) { return i.fried; })) out.push("Frituras absorvem quantidades variáveis de óleo.");
  if (cooked && !hasFat) out.push("Nenhum óleo, azeite ou manteiga foi declarado no preparo.");
  if (items.some(function (i) { return i.conf === "baixa"; })) out.push("Há itens com valores de referência pouco precisos (pratos compostos).");
  if (items.some(function (i) { return i.gi > 0 && i.giRange && (i.giRange[1] - i.giRange[0]) >= 20; })) out.push("O índice glicêmico de alguns itens varia com o preparo e o ponto de cozimento.");
  if (meal.source === "photo") out.push("A quantidade estimada a partir de uma foto não substitui a pesagem.");
  if (U.pos(meal.leftoverPct) > 0) out.push("Foi descontado " + U.round(meal.leftoverPct, 0) + "% que sobrou no prato.");
  return out;
};

C.glClass = function (gl) {
  gl = U.pos(gl);
  if (gl <= 10) return { id: "baixa", label: "baixa", tone: "good" };
  if (gl <= 19) return { id: "moderada", label: "moderada", tone: "warn" };
  return { id: "alta", label: "alta", tone: "bad" };
};

C.dayGlClass = function (gl) {
  var b = App.profile.glBands;
  gl = U.pos(gl);
  if (gl <= b[0]) return { id: "muito_favoravel", label: "controle muito favorável", tone: "good" };
  if (gl <= b[1]) return { id: "adequado", label: "adequado", tone: "good" };
  if (gl <= b[2]) return { id: "moderado", label: "moderadamente elevado", tone: "warn" };
  return { id: "elevado", label: "elevado", tone: "bad" };
};

/* Totais do dia — apenas refeições marcadas como consumidas */
C.day = function (meals) {
  var consumed = (meals || []).filter(function (m) { return m.mode === "consumed"; });
  var t = C.ZERO(), lo = C.ZERO(), hi = C.ZERO();
  var giNum = 0, giDen = 0;
  var highGl = 0, indulgent = 0, up = 0, liquidKcal = 0, trainingGl = 0;
  var times = [];

  consumed.forEach(function (m) {
    var mt = C.meal(m);
    C.add(t, mt); C.add(lo, mt.low); C.add(hi, mt.high);
    giNum += U.pos(mt.giWeighted) * mt.availCarb;
    giDen += mt.availCarb;
    if (mt.gl >= 20) highGl++;
    if (m.mealType === "livre" || m.context === "indulgente") indulgent++;
    if (App.isTrainingContext(m.context)) trainingGl += mt.gl;
    (m.items || []).forEach(function (it) {
      var r = C.item(it, m.leftoverPct);
      if (it.up) up++;
      if (it.unit === "ml") liquidKcal += r.kcal;
    });
    if (m.time) times.push(m.time);
  });

  t.low = lo; t.high = hi;
  t.giWeighted = giDen >= 5 ? U.round(giNum / giDen, 0) : null;
  t.mealCount = consumed.length;
  t.queryCount = (meals || []).length - consumed.length;
  t.highGlMeals = highGl;
  t.indulgentMeals = indulgent;
  t.ultraprocessed = up;
  t.liquidKcal = liquidKcal;
  t.trainingGl = trainingGl;
  t.glClass = C.dayGlClass(t.gl);
  t.maxGapHours = C.maxGap(times);
  t.contexts = consumed.map(function (m) { return m.context; }).filter(function (c) { return c && c !== "nenhum"; });
  return t;
};

C.maxGap = function (times) {
  if (times.length < 2) return null;
  var mins = times.map(function (t) {
    var p = String(t).split(":");
    return U.n(p[0]) * 60 + U.n(p[1]);
  }).sort(function (a, b) { return a - b; });
  var max = 0;
  for (var i = 1; i < mins.length; i++) max = Math.max(max, mins[i] - mins[i - 1]);
  return U.round(max / 60, 1);
};

/* Receita: valores por 100 g calculados dos ingredientes + rendimento */
C.recipePer100 = function (recipe) {
  var t = C.ZERO(), giNum = 0, giDen = 0, worst = 3;
  var confRank = { alta: 3, media: 2, baixa: 1 };
  (recipe.items || []).forEach(function (it) {
    var r = C.atGrams(it, it.grams);
    C.add(t, r);
    giNum += U.pos(it.gi) * r.availCarb;
    giDen += r.availCarb;
    worst = Math.min(worst, confRank[it.conf] || 2);
  });
  var total = U.pos(recipe.totalWeight) || (recipe.items || []).reduce(function (s, i) { return s + U.pos(i.grams); }, 0);
  if (total <= 0) total = 100;
  var f = 100 / total;
  return {
    per100: {
      kcal: U.round(t.kcal * f, 1), protein: U.round(t.protein * f, 1), carb: U.round(t.carb * f, 1),
      fiber: U.round(t.fiber * f, 1), fat: U.round(t.fat * f, 1),
      sat: U.round(t.sat * f, 1), sodium: U.round(t.sodium * f, 1)
    },
    gi: giDen >= 1 ? U.round(giNum / giDen, 0) : 0,
    giRange: giDen >= 1 ? [U.round(giNum / giDen * 0.82, 0), U.round(giNum / giDen * 1.18, 0)] : [0, 0],
    conf: worst === 3 ? "media" : "baixa",   // receita nunca é "alta": há perda de água e óleo no preparo
    totalWeight: total
  };
};

/* Posição percentual de um valor dentro de uma escala, para as barras */
C.pct = function (value, max) {
  if (!isFinite(max) || max <= 0) return 0;
  return U.clamp((U.pos(value) / max) * 100, 0, 100);
};

/* Situação em relação a uma meta em faixa */
C.goalState = function (value, goal) {
  if (!goal || goal.length !== 2) return { id: "none", label: "" };
  var v = U.pos(value);
  if (v < goal[0] * 0.9) return { id: "below", label: "abaixo da faixa", tone: "warn" };
  if (v < goal[0]) return { id: "near", label: "quase na faixa", tone: "warn" };
  if (v <= goal[1]) return { id: "in", label: "dentro da faixa", tone: "good" };
  if (v <= goal[1] * 1.1) return { id: "slight", label: "pouco acima", tone: "warn" };
  return { id: "above", label: "acima da faixa", tone: "bad" };
};
/* ============================================== 8. SISTEMA DE REGRAS LOCAIS
   Orientações determinísticas, práticas e neutras. Sem diagnóstico, sem
   prescrição, sem alarmismo. Nada aqui usa IA.
   ========================================================================== */
var R = App.rules = {};

R.day = function (t, meals) {
  var g = App.profile.goals;
  var out = { score: null, classification: "", positives: [], opportunities: [], tips: [], enough: t.mealCount > 0 };
  if (!out.enough) {
    out.classification = "sem registros";
    out.tips.push("Registre ao menos uma refeição para que o dia possa ser analisado.");
    return out;
  }

  var s = 10, tips = [];
  var pState = C.goalState(t.protein, g.protein);
  var kState = C.goalState(t.kcal, g.kcal);
  var fState = C.goalState(t.fiber, g.fiber);
  var trainingShare = t.gl > 0 ? t.trainingGl / t.gl : 0;

  /* proteína */
  if (pState.id === "below") { s -= 2; out.opportunities.push("Proteína abaixo da faixa (" + U.fmt(t.protein) + " g de " + g.protein[0] + "–" + g.protein[1] + " g)."); tips.push({ p: 9, t: "Acrescente uma fonte proteica em uma refeição onde ela ficou ausente — ovos, frango, carne, iogurte ou whey." }); }
  else if (pState.id === "near") { s -= 0.8; out.opportunities.push("Proteína ficou logo abaixo da faixa escolhida."); tips.push({ p: 6, t: "Faltou pouco para a faixa proteica. Um iogurte ou dois ovos costumam fechar a diferença." }); }
  else if (pState.id === "in") { out.positives.push("Proteína dentro da faixa planejada."); }
  else { s -= 0.3; out.positives.push("Proteína generosa, acima da faixa."); }

  /* calorias */
  if (kState.id === "above") { s -= 1.5; out.opportunities.push("Calorias acima da faixa (" + U.fmt(t.kcal) + " kcal)."); tips.push({ p: 8, t: "O excedente calórico veio principalmente de porções maiores. Reduzir uma porção de carboidrato ou de gordura de preparo já reequilibra." }); }
  else if (kState.id === "slight") { s -= 0.5; }
  else if (kState.id === "below") { s -= 1; out.opportunities.push("Calorias bem abaixo da faixa — em dias de treino isso pesa na recuperação."); tips.push({ p: 7, t: "Dias de ingestão muito baixa atrapalham a recuperação. Considere uma refeição a mais, mesmo simples." }); }
  else out.positives.push("Calorias dentro da faixa planejada.");

  /* fibras */
  if (t.fiber < g.fiber[0] * 0.6) { s -= 1.8; out.opportunities.push("Fibras bem abaixo do desejado (" + U.fmt(t.fiber, 1) + " g)."); tips.push({ p: 8, t: "Inclua feijão, aveia, frutas com casca ou uma salada em duas refeições do dia." }); }
  else if (fState.id === "below" || fState.id === "near") { s -= 1; out.opportunities.push("Fibras abaixo da faixa."); tips.push({ p: 5, t: "Uma fruta e uma porção de vegetais a mais costumam resolver a diferença de fibras." }); }
  else out.positives.push("Boa ingestão de fibras.");

  /* carga glicêmica */
  var gc = t.glClass;
  if (gc.id === "muito_favoravel") { s += 0.5; out.positives.push("Carga glicêmica diária muito favorável."); }
  else if (gc.id === "adequado") { out.positives.push("Carga glicêmica diária adequada."); }
  else if (gc.id === "moderado") {
    if (trainingShare >= 0.4) { s -= 0.4; out.positives.push("Carga glicêmica moderada, mas boa parte ocorreu próxima ao treino."); }
    else { s -= 0.8; out.opportunities.push("Carga glicêmica moderadamente elevada (" + U.fmt(t.gl) + ")."); tips.push({ p: 6, t: "Distribuir os carboidratos entre mais refeições reduz a carga glicêmica de cada uma sem cortar quantidade." }); }
  } else {
    if (trainingShare >= 0.4) { s -= 0.9; out.opportunities.push("Carga glicêmica alta, porém concentrada perto da atividade física."); tips.push({ p: 5, t: "A carga glicêmica foi elevada, mas parte relevante ocorreu próxima ao treino. Avalie o contexto antes de reduzir carboidratos." }); }
    else { s -= 1.8; out.opportunities.push("Carga glicêmica diária elevada (" + U.fmt(t.gl) + ")."); tips.push({ p: 9, t: "Em uma das refeições de maior carga, mantenha uma fonte principal de carboidrato e aumente proteína ou vegetais." }); }
  }

  if (t.highGlMeals >= 2 && trainingShare < 0.3) { s -= 0.5; out.opportunities.push(t.highGlMeals + " refeições com carga glicêmica alta."); }

  /* ultraprocessados, líquidos, espaçamento, variedade */
  if (t.ultraprocessed >= 4) { s -= 1; out.opportunities.push("Muitos itens ultraprocessados no dia."); tips.push({ p: 6, t: "Trocar um item industrializado por uma preparação caseira semelhante já muda o padrão do dia." }); }
  else if (t.ultraprocessed >= 2) s -= 0.4;

  if (t.kcal > 0 && t.liquidKcal / t.kcal > 0.15) { s -= 0.7; out.opportunities.push("Parcela relevante das calorias veio de bebidas (" + U.fmt(t.liquidKcal) + " kcal)."); tips.push({ p: 7, t: "Calorias líquidas saciam pouco. Reduzir uma bebida calórica é o ajuste de menor esforço." }); }

  if (t.mealCount >= 3) { s += 0.4; } else { out.opportunities.push("Poucas refeições registradas — a distribuição proteica fica prejudicada."); tips.push({ p: 6, t: "Distribuir a proteína em pelo menos três refeições aproveita melhor cada porção." }); }
  if (t.maxGapHours !== null && t.maxGapHours > 7) { s -= 0.5; out.opportunities.push("Intervalo longo entre refeições (" + U.fmt(t.maxGapHours, 1) + " h)."); }

  var ids = {};
  (meals || []).forEach(function (m) { if (m.mode === "consumed") (m.items || []).forEach(function (i) { ids[i.foodId] = 1; }); });
  var variety = Object.keys(ids).length;
  if (variety >= 8) { s += 0.3; out.positives.push("Boa variedade de alimentos (" + variety + " itens diferentes)."); }
  else if (variety <= 3) { s -= 0.4; out.opportunities.push("Pouca variedade de alimentos."); }

  if (t.indulgentMeals === 1) out.positives.push("Uma refeição mais indulgente não invalida o padrão geral do dia.");

  out.score = U.round(U.clamp(s, 0, 10), 1);
  out.classification =
    out.score >= 8.5 ? "muito equilibrado" :
    out.score >= 7 ? "bom" :
    out.score >= 5.5 ? "equilibrado com ajustes" :
    out.score >= 4 ? "irregular" : "distante do seu plano";

  tips.sort(function (a, b) { return b.p - a.p; });
  out.tips = tips.slice(0, 3).map(function (x) { return x.t; });
  while (out.tips.length < 3) {
    var extra = [
      "Mantenha o registro no mesmo dia: a estimativa fica bem mais fiel do que reconstruída depois.",
      "Repetir as refeições que funcionaram reduz decisão e aumenta a consistência da semana.",
      "Anote o contexto de treino nas refeições — a leitura da carga glicêmica muda com ele."
    ];
    var cand = extra[out.tips.length];
    if (out.tips.indexOf(cand) === -1) out.tips.push(cand); else break;
  }
  return out;
};

R.period = function (agg, kind) {
  var g = App.profile.goals, out = { insights: [], recommendations: [], trend: "insuficiente", score: null };
  var minDays = kind === "month" ? 8 : 3;
  if (agg.daysLogged < minDays) {
    out.insights.push("Foram registrados " + agg.daysLogged + " dia(s). Com poucos dias, qualquer leitura de tendência seria frágil.");
    out.recommendations.push("Registre mais dias para que a análise de tendência seja confiável.");
    return out;
  }

  var avgP = agg.avg.protein, avgK = agg.avg.kcal, avgF = agg.avg.fiber, avgGl = agg.avg.gl;
  var pIn = agg.adherence.protein, kIn = agg.adherence.kcal;

  if (agg.daysBelowProtein >= 3) {
    out.insights.push("A proteína ficou abaixo da faixa em " + agg.daysBelowProtein + " dias.");
    out.recommendations.push("Sua ingestão proteica esteve abaixo da faixa escolhida em vários dias. Considere distribuir fontes proteicas entre as principais refeições.");
  } else if (pIn >= 0.7) {
    out.insights.push("Proteína dentro da faixa em " + Math.round(pIn * 100) + "% dos dias.");
  }

  if (avgF < g.fiber[0]) out.recommendations.push("A média de fibras (" + U.fmt(avgF, 1) + " g) ficou abaixo da faixa. Feijão, aveia, frutas e vegetais são os ajustes de menor esforço.");
  else out.insights.push("Média de fibras dentro do desejado.");

  var glCls = C.dayGlClass(avgGl);
  out.insights.push("Carga glicêmica média de " + U.fmt(avgGl) + " — " + glCls.label + ".");
  if (glCls.id === "elevado" && agg.trainingDays >= agg.daysLogged * 0.4) {
    out.recommendations.push("A carga glicêmica média foi elevada, porém boa parte dos dias teve treino. Avalie o contexto antes de reduzir carboidratos.");
  } else if (glCls.id === "elevado" || glCls.id === "moderado") {
    out.recommendations.push("Em refeições que combinaram várias fontes concentradas de carboidrato, mantenha uma principal e aumente proteína ou vegetais.");
  }

  if (agg.indulgentMeals <= 2 && agg.daysLogged >= 5) out.insights.push("Poucas refeições indulgentes no período — o padrão geral está consistente.");
  else if (agg.indulgentMeals >= 5) out.recommendations.push("As refeições indulgentes ficaram frequentes. Planejá-las em dias fixos costuma preservar a flexibilidade sem perder o controle.");

  if (agg.upPerDay >= 3) out.recommendations.push("Média de " + U.fmt(agg.upPerDay, 1) + " itens ultraprocessados por dia. Substituir um deles por preparação caseira já muda o padrão semanal.");

  if (agg.trainingDays > 0 && agg.restDays > 0) {
    var d = agg.avgTraining.kcal - agg.avgRest.kcal;
    out.insights.push("Dias com treino tiveram, em média, " + U.fmt(Math.abs(d)) + " kcal " + (d >= 0 ? "a mais" : "a menos") + " que os dias de descanso.");
    if (d < -100) out.recommendations.push("A ingestão caiu justamente nos dias de treino. Ajustar o carboidrato para cima nesses dias tende a melhorar a recuperação.");
  }

  /* tendência: primeira metade × segunda metade */
  if (agg.daysLogged >= (kind === "month" ? 10 : 5)) {
    var half = Math.floor(agg.series.length / 2);
    var a = R.mean(agg.series.slice(0, half).map(function (x) { return x.score; }).filter(isFinite));
    var b = R.mean(agg.series.slice(half).map(function (x) { return x.score; }).filter(isFinite));
    if (a === null || b === null) out.trend = "insuficiente";
    else if (b - a >= 0.6) out.trend = "melhora";
    else if (a - b >= 0.6) out.trend = "regressão";
    else out.trend = "estabilidade";
  }

  var adher = (pIn + kIn) / 2;
  var scoreAvg = R.mean(agg.series.map(function (x) { return x.score; }).filter(isFinite));
  out.score = scoreAvg === null ? null : U.round(U.clamp(scoreAvg * 0.75 + adher * 2.5, 0, 10), 1);
  if (out.recommendations.length === 0) out.recommendations.push("O padrão está estável e dentro do planejado. Mantenha o registro e reavalie as faixas a cada quatro semanas.");
  return out;
};

R.mean = function (arr) {
  var v = (arr || []).filter(function (x) { return isFinite(x); });
  if (!v.length) return null;
  return v.reduce(function (a, b) { return a + b; }, 0) / v.length;
};

/* ==================================================== 9. ADAPTADOR DE IA
   Camada isolada. Nesta versão não há backend: nada é inventado.
   ========================================================================== */
var AI = App.ai = {
  isConfigured: function () {
    var ep = (App.settings.aiEndpoint || "").trim();
    return /^https:\/\/.+/i.test(ep);
  },
  endpoint: function () { return (App.settings.aiEndpoint || "").trim().replace(/\/$/, ""); },

  analyzeImage: function (blob) {
    if (!AI.isConfigured()) {
      return Promise.reject({
        code: "not_configured",
        message: "A análise por IA ainda não está conectada. Preencha os alimentos manualmente ou configure um endpoint em Ajustes."
      });
    }
    return AI.toBase64(blob).then(function (b64) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 45000);
      return fetch(AI.endpoint() + "/api/nutrition/analyze-image", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: b64, mimeType: blob.type || "image/jpeg", locale: "pt-BR" }),
        signal: ctrl.signal
      }).then(function (res) {
        clearTimeout(timer);
        if (!res.ok) throw { code: "http_" + res.status, message: "O serviço respondeu com erro " + res.status + "." };
        return res.json();
      }).then(function (json) {
        var v = AI.validate(json);
        if (!v.ok) throw { code: "invalid_response", message: "A resposta do serviço não seguiu o formato esperado: " + v.reason };
        return v.data;
      }).catch(function (err) {
        clearTimeout(timer);
        if (err && err.name === "AbortError") throw { code: "timeout", message: "O serviço demorou demais para responder." };
        if (err && err.code) throw err;
        throw { code: "network", message: "Não foi possível falar com o serviço de análise." };
      });
    });
  },

  /* Valida a resposta antes de qualquer uso. Nada entra na tela sem passar aqui. */
  validate: function (json) {
    if (!json || typeof json !== "object") return { ok: false, reason: "resposta vazia" };
    if (!Array.isArray(json.items)) return { ok: false, reason: "campo items ausente" };
    var items = [];
    for (var i = 0; i < json.items.length; i++) {
      var it = json.items[i];
      if (!it || typeof it.name !== "string" || !it.name.trim()) return { ok: false, reason: "item " + (i + 1) + " sem nome" };
      var grams = U.pos(it.estimatedGrams);
      if (!(grams > 0) || grams > 5000) return { ok: false, reason: "quantidade inválida em \"" + it.name + "\"" };
      var range = Array.isArray(it.rangeGrams) && it.rangeGrams.length === 2
        ? [U.pos(it.rangeGrams[0]), U.pos(it.rangeGrams[1])] : null;
      if (range && (range[0] > range[1] || range[1] > 6000)) range = null;
      items.push({
        name: it.name.trim().slice(0, 80),
        estimatedGrams: U.round(grams, 0),
        rangeGrams: range,
        preparation: typeof it.preparation === "string" ? it.preparation.slice(0, 40) : "",
        confidence: U.clamp(U.n(it.confidence, 0.6), 0, 1),
        possibleAlternatives: Array.isArray(it.possibleAlternatives) ? it.possibleAlternatives.slice(0, 5).map(String) : []
      });
    }
    if (!items.length) return { ok: false, reason: "nenhum alimento identificado" };
    return {
      ok: true,
      data: {
        mealDescription: typeof json.mealDescription === "string" ? json.mealDescription.slice(0, 200) : "",
        items: items,
        uncertainties: Array.isArray(json.uncertainties) ? json.uncertainties.slice(0, 8).map(String) : []
      }
    };
  },

  generateWeeklyInsight: function () {
    return Promise.reject({ code: "not_configured", message: "Os textos do relatório são gerados por regras locais nesta versão." });
  },
  generateMonthlyInsight: function () {
    return Promise.reject({ code: "not_configured", message: "Os textos do relatório são gerados por regras locais nesta versão." });
  },

  toBase64: function (blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(",")[1]); };
      fr.onerror = function () { reject({ code: "read_error", message: "Não foi possível ler a imagem." }); };
      fr.readAsDataURL(blob);
    });
  },

  /* Demonstração: dados fixos, sempre rotulados. Nunca se apresenta como análise da foto. */
  demo: function () {
    return {
      demo: true,
      mealDescription: "Exemplo de demonstração: arroz, feijão, frango e salada",
      items: [
        { foodId: "arroz_branco_cozido", grams: 120 },
        { foodId: "feijao_carioca", grams: 90 },
        { foodId: "peito_frango_grelhado", grams: 130 },
        { foodId: "salada_crua", grams: 70 },
        { foodId: "azeite", grams: 6 }
      ],
      uncertainties: ["Estes valores são um exemplo fixo, não uma leitura da sua foto."]
    };
  }
};

/* ==================================================== 10. GRÁFICOS (Canvas)
   Sem bibliotecas externas. Redesenha a cada troca de tema/tamanho.
   ========================================================================== */
var Ch = App.charts = { registry: [] };

Ch.css = function (name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
};

Ch.setup = function (canvas, h) {
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var w = canvas.clientWidth || canvas.parentNode.clientWidth || 320;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.height = h + "px";
  var ctx = canvas.getContext && canvas.getContext("2d");
  if (!ctx) return null;                       // canvas indisponível: o resto da tela segue funcionando
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx: ctx, w: w, h: h };
};

Ch.draw = function (canvas, opts) {
  Ch.registry = Ch.registry.filter(function (r) { return document.body.contains(r.canvas); });
  Ch.registry.push({ canvas: canvas, opts: opts });
  Ch.render(canvas, opts);
};

Ch.redrawAll = function () {
  Ch.registry = Ch.registry.filter(function (r) { return document.body.contains(r.canvas); });
  Ch.registry.forEach(function (r) { Ch.render(r.canvas, r.opts); });
};

Ch.render = function (canvas, o) {
  var H = o.height || 160;
  var s = Ch.setup(canvas, H);
  if (!s) return;
  var ctx = s.ctx, w = s.w, h = s.h;
  var padL = 34, padR = 8, padT = 12, padB = 22;
  var cw = Math.max(10, w - padL - padR), chh = Math.max(10, h - padT - padB);
  var vals = (o.values || []).map(function (v) { return U.pos(v); });
  var band = o.band && o.band.length === 2 ? o.band : null;
  var maxV = Math.max.apply(null, vals.concat([band ? band[1] : 0, 1]));
  maxV = maxV * 1.12;
  var line = Ch.css("--line"), faint = Ch.css("--faint"), color = o.color || Ch.css("--accent");
  var yOf = function (v) { return padT + chh - (U.pos(v) / maxV) * chh; };

  /* grade */
  ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.fillStyle = faint;
  ctx.font = "10px " + (o.font || "-apple-system, sans-serif");
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (var i = 0; i <= 2; i++) {
    var v = maxV * i / 2, y = Math.round(yOf(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(U.fmt(v, v < 10 ? 1 : 0), padL - 6, y);
  }

  /* faixa de meta */
  if (band) {
    ctx.fillStyle = Ch.css("--accent-soft");
    var yTop = yOf(band[1]), yBot = yOf(band[0]);
    ctx.globalAlpha = 0.75;
    ctx.fillRect(padL, yTop, cw, Math.max(2, yBot - yTop));
    ctx.globalAlpha = 1;
  }

  var n = vals.length || 1;

  if (o.type === "line") {
    ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    vals.forEach(function (v, i2) {
      var x = padL + (n === 1 ? cw / 2 : (cw * i2) / (n - 1)), y = yOf(v);
      if (i2 === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.fillStyle = color;
    vals.forEach(function (v, i2) {
      var x = padL + (n === 1 ? cw / 2 : (cw * i2) / (n - 1)), y = yOf(v);
      ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
    });
  } else {
    var gap = n > 14 ? 2 : 6;
    var bw = Math.max(3, (cw - gap * (n - 1)) / n);
    vals.forEach(function (v, i2) {
      var x = padL + i2 * (bw + gap), y = yOf(v), bh = Math.max(v > 0 ? 2 : 0, padT + chh - y);
      ctx.fillStyle = (o.colors && o.colors[i2]) || color;
      var r = Math.min(4, bw / 2);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, bw, bh, [r, r, 0, 0]);
      else ctx.rect(x, y, bw, bh);
      ctx.fill();
    });
  }

  /* rótulos do eixo x */
  if (o.labels && o.labels.length) {
    ctx.fillStyle = faint; ctx.textAlign = "center"; ctx.textBaseline = "top";
    var step = o.labels.length > 12 ? Math.ceil(o.labels.length / 8) : 1;
    o.labels.forEach(function (lb, i2) {
      if (i2 % step !== 0 && i2 !== o.labels.length - 1) return;
      var x = o.type === "line"
        ? padL + (n === 1 ? cw / 2 : (cw * i2) / (n - 1))
        : padL + i2 * ((cw - (n > 14 ? 2 : 6) * (n - 1)) / n + (n > 14 ? 2 : 6)) + ((cw - (n > 14 ? 2 : 6) * (n - 1)) / n) / 2;
      ctx.fillText(String(lb), x, padT + chh + 6);
    });
  }
};
/* ================================================= 11. CAMADA DE DADOS */
var D = App.data = {
  meals: [],
  days: {},
  lastRemoved: null,

  load: function () {
    return Promise.all([IDB.all("meals"), IDB.all("days")]).then(function (res) {
      D.meals = (res[0] || []).filter(function (m) { return m && m.id && m.date; });
      D.days = {};
      (res[1] || []).forEach(function (d) { if (d && d.date) D.days[d.date] = d; });
      D.sort();
      return true;
    }).catch(function (e) {
      console.warn("[NutriLog] falha ao carregar registros:", e);
      D.meals = []; D.days = {};
      return false;
    });
  },
  sort: function () {
    D.meals.sort(function (a, b) {
      return a.date === b.date ? String(a.time).localeCompare(String(b.time)) : a.date.localeCompare(b.date);
    });
  },
  byDate: function (date) { return D.meals.filter(function (m) { return m.date === date; }); },
  byRange: function (from, to) { return D.meals.filter(function (m) { return m.date >= from && m.date <= to; }); },
  get: function (id) { return D.meals.filter(function (m) { return m.id === id; })[0] || null; },
  datesLogged: function () {
    var s = {};
    D.meals.forEach(function (m) { if (m.mode === "consumed") s[m.date] = 1; });
    return Object.keys(s).sort();
  },

  newMeal: function (over) {
    return Object.assign({
      id: U.uid("meal"),
      schemaVersion: SCHEMA_VERSION,
      date: U.todayISO(),
      time: U.nowHM(),
      mealType: D.suggestType(),
      mode: App.settings.defaultMode,
      context: "nenhum",
      notes: "",
      items: [],
      leftoverPct: 0,
      source: "manual",          // manual | photo | repeat | recipe | demo
      photo: null,
      description: "",
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    }, over || {});
  },
  suggestType: function () {
    var h = new Date().getHours();
    if (h < 10) return "cafe";
    if (h < 15) return "almoco";
    if (h < 18) return "lanche";
    if (h < 22) return "jantar";
    return "ceia";
  },

  save: function (meal) {
    meal.updatedAt = new Date().toISOString();
    if (!App.settings.keepPhotos) meal.photo = null;
    var i = D.meals.findIndex(function (m) { return m.id === meal.id; });
    var isNew = i < 0;
    if (isNew) D.meals.push(meal); else D.meals[i] = meal;
    D.sort();
    return IDB.put("meals", meal).then(function () {
      D.emit(isNew ? "nutrition:mealRegistered" : "nutrition:mealUpdated", meal);
      return meal;
    });
  },
  remove: function (id) {
    var m = D.get(id);
    if (!m) return Promise.resolve(false);
    D.lastRemoved = JSON.parse(JSON.stringify(m));
    D.meals = D.meals.filter(function (x) { return x.id !== id; });
    return IDB.del("meals", id).then(function () {
      D.emit("nutrition:mealRemoved", m);
      return true;
    });
  },
  undoRemove: function () {

  clearDay: function (date) {

/* ------------------------------------------------- Agregação de períodos */
D.aggregate = function (from, to) {
  var series = [], dates = [];
  for (var d = from; d <= to; d = U.addDays(d, 1)) dates.push(d);
  var g = App.profile.goals;
  var sum = { kcal: 0, protein: 0, carb: 0, fiber: 0, fat: 0, gl: 0, availCarb: 0 };
  var daysLogged = 0, daysBelowProtein = 0, indulgentMeals = 0, up = 0, mealsTotal = 0;
  var pIn = 0, kIn = 0, closed = 0, trainingDays = 0, restDays = 0;
  var trainAcc = { kcal: 0, gl: 0, n: 0 }, restAcc = { kcal: 0, gl: 0, n: 0 };
  var typeCount = {};

  dates.forEach(function (date) {
    var meals = D.byDate(date);
    var t = C.day(meals);
    var logged = t.mealCount > 0;
    var an = logged ? R.day(t, meals) : { score: NaN };
    if (logged) {
      daysLogged++;
      sum.kcal += t.kcal; sum.protein += t.protein; sum.carb += t.carb; sum.fiber += t.fiber;
      sum.fat += t.fat; sum.gl += t.gl; sum.availCarb += t.availCarb;
      if (t.protein < g.protein[0]) daysBelowProtein++;
      if (C.goalState(t.protein, g.protein).id === "in") pIn++;
      if (C.goalState(t.kcal, g.kcal).id === "in") kIn++;
      indulgentMeals += t.indulgentMeals;
      up += t.ultraprocessed;
      mealsTotal += t.mealCount;
      var isTrain = t.contexts.some(function (c) { return App.isTrainingContext(c); });
      if (isTrain) { trainingDays++; trainAcc.kcal += t.kcal; trainAcc.gl += t.gl; trainAcc.n++; }
      else { restDays++; restAcc.kcal += t.kcal; restAcc.gl += t.gl; restAcc.n++; }
      meals.filter(function (m) { return m.mode === "consumed"; })
        .forEach(function (m) { typeCount[m.mealType] = (typeCount[m.mealType] || 0) + 1; });
    }
    if (D.isClosed(date)) closed++;
    series.push({
      date: date, logged: logged, kcal: t.kcal, protein: t.protein, carb: t.carb, fiber: t.fiber,
      fat: t.fat, gl: t.gl, score: an.score === null ? NaN : an.score, mealCount: t.mealCount,
      training: t.contexts.some(function (c) { return App.isTrainingContext(c); })
    });
  });

  var div = daysLogged || 1;
  var logged = series.filter(function (s) { return s.logged; });
  var best = logged.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); })[0] || null;
  var topKcal = logged.slice().sort(function (a, b) { return b.kcal - a.kcal; })[0] || null;
  var topGl = logged.slice().sort(function (a, b) { return b.gl - a.gl; })[0] || null;
  var topProtein = logged.slice().sort(function (a, b) { return b.protein - a.protein; })[0] || null;

  return {
    from: from, to: to, dates: dates, series: series, daysTotal: dates.length,
    daysLogged: daysLogged, daysClosed: closed,
    avg: {
      kcal: sum.kcal / div, protein: sum.protein / div, carb: sum.carb / div,
      fiber: sum.fiber / div, fat: sum.fat / div, gl: sum.gl / div, availCarb: sum.availCarb / div
    },
    totals: sum,
    adherence: { protein: pIn / div, kcal: kIn / div },
    daysBelowProtein: daysBelowProtein,
    indulgentMeals: indulgentMeals,
    upPerDay: up / div,
    mealsPerDay: mealsTotal / div,
    trainingDays: trainingDays, restDays: restDays,
    avgTraining: { kcal: trainAcc.n ? trainAcc.kcal / trainAcc.n : 0, gl: trainAcc.n ? trainAcc.gl / trainAcc.n : 0 },

/* Barra de estimativa: faixa provável + marca central + faixa de meta */
UI.estimateBar = function (o) {
  var scaleMax = Math.max(o.high || 0, o.goal ? o.goal[1] : 0, o.value || 0, 1) * 1.15;
  var p = function (v) { return U.clamp((U.pos(v) / scaleMax) * 100, 0, 100); };
  var wrap = el("div", { class: "est" });
  var track = el("div", { class: "est-track" });
  var range = el("div", { class: "est-range" + (o.tone === "cit" ? " cit" : "") });
  range.style.left = p(o.low) + "%";
  range.style.right = (100 - p(o.high)) + "%";
  var tick = el("div", { class: "est-tick" + (o.tone === "cit" ? " cit" : "") });
  tick.style.left = p(o.value) + "%";
  track.appendChild(range);
  if (o.goal) {
    var goal = el("div", { class: "est-goal" });
    goal.style.left = p(o.goal[0]) + "%";
    goal.style.right = (100 - p(o.goal[1])) + "%";
    track.appendChild(goal);
  }
  track.appendChild(tick);
  wrap.appendChild(track);
  wrap.appendChild(el("div", { class: "est-legend" }, [
    el("span", { class: "mono", text: U.fmt(o.low, o.dec || 0) }),
    el("span", { text: o.goal ? "meta " + U.fmt(o.goal[0]) + "–" + U.fmt(o.goal[1]) : "faixa provável" }),
    el("span", { class: "mono", text: U.fmt(o.high, o.dec || 0) })
  ]));
  return wrap;
};

UI.macroRow = function (name, value, goal, unit, tone) {
  var st = C.goalState(value, goal);
  var max = goal ? goal[1] * 1.35 : Math.max(value, 1) * 1.2;
  var row = el("div", { class: "macro" });
  row.appendChild(el("div", { class: "macro-top" }, [
    el("span", { class: "macro-name", text: name }),
    el("span", {}, [
      el("span", { class: "macro-val", text: U.fmt(value, unit === "g" && value < 100 ? 1 : 0) }),
      el("span", { class: "tiny muted", text: " " + unit + (goal ? " · " + U.fmt(goal[0]) + "–" + U.fmt(goal[1]) : "") })
    ])
  ]));
  var bar = el("div", { class: "bar" + (tone === "cit" ? " cit" : (st.tone === "bad" ? " bad" : (st.tone === "warn" ? " warn" : ""))) });
  var fill = el("i"); fill.style.width = C.pct(value, max) + "%";
  bar.appendChild(fill);
  if (goal) {
    var b = el("b");
    b.style.left = C.pct(goal[0], max) + "%";
    b.style.width = Math.max(1, C.pct(goal[1], max) - C.pct(goal[0], max)) + "%";
    bar.appendChild(b);
  }
  row.appendChild(bar);
  if (st.label) row.appendChild(el("p", { class: "tiny " + (st.tone === "good" ? "muted" : "muted"), text: st.label, style: "margin-top:4px" }));
  return row;
};

UI.ring = function (value, goal) {
  var size = 116, sw = 11, r = (size - sw) / 2, cx = size / 2, circ = 2 * Math.PI * r;
  var target = goal ? (goal[0] + goal[1]) / 2 : Math.max(value, 1);
  var pct = U.clamp(U.pos(value) / (target || 1), 0, 1.25);
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size);
  svg.setAttribute("viewBox", "0 0 " + size + " " + size);
  svg.setAttribute("aria-hidden", "true");
  function circle(cls, dash, offset, width) {
    var c = document.createElementNS(ns, "circle");
    c.setAttribute("class", "ring-c " + cls);
    c.setAttribute("cx", cx); c.setAttribute("cy", cx); c.setAttribute("r", r);
    c.setAttribute("stroke-width", width || sw);
    if (dash !== null) { c.setAttribute("stroke-dasharray", dash); c.setAttribute("stroke-dashoffset", offset); }
    return c;
  }
  svg.appendChild(circle("bg", null, null));
  svg.appendChild(circle("fg", circ, circ * (1 - Math.min(pct, 1))));
  var wrap = el("div", { class: "ring" });
  wrap.appendChild(svg);
  wrap.appendChild(el("div", { class: "ring-center" }, [
    el("div", { class: "v", text: U.fmt(value) }),
    el("div", { class: "l", text: "kcal" })
  ]));
  return wrap;
};

FL.onFileChosen = function (file) {
  if (!file) return;                                  // cancelado: nada acontece
  if (!/^image\//.test(file.type)) return UI.toast("Escolha um arquivo de imagem.");
  if (file.size > 25 * 1024 * 1024) return UI.toast("Imagem muito grande. Tente uma foto menor.");
  UI.toast("Preparando a imagem...", null, null, 1500);

  }).catch(function () {

  });
};

/* Redimensiona, corrige orientação e comprime — tudo no navegador */
FL.processImage = function (file) {
  var MAX = 1280;
  function fromBitmap() {
    if (!window.createImageBitmap) return Promise.reject();
    return createImageBitmap(file, { imageOrientation: "from-image" });
  }
  function fromImg() {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(); };
      img.src = url;
    });
  }
  return fromBitmap().catch(fromImg).then(function (src) {
    var w = src.width, h = src.height;
    var scale = Math.min(1, MAX / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale)), chh = Math.max(1, Math.round(h * scale));
    var cv = document.createElement("canvas");
    cv.width = cw; cv.height = chh;
    cv.getContext("2d").drawImage(src, 0, 0, cw, chh);
    if (src.close) src.close();
    var dataUrl = cv.toDataURL("image/jpeg", 0.8);
    return new Promise(function (resolve) {
      if (cv.toBlob) cv.toBlob(function (blob) { resolve({ dataUrl: dataUrl, blob: blob, w: cw, h: chh }); }, "image/jpeg", 0.8);
      else resolve({ dataUrl: dataUrl, blob: null, w: cw, h: chh });
    });
  });
};

FL.runAI = function (photo) {
  UI.toast("Enviando para análise...", null, null, 2000);
  App.ai.analyzeImage(photo.blob || photo.dataUrl).then(function (res) {
    UI.closeSheet();
    var m = D.newMeal({ source: "photo", description: res.mealDescription, photo: App.settings.keepPhotos ? photo.dataUrl : null });
    res.items.forEach(function (ai) {
      var match = DB.search(ai.name)[0];
      var food = match || {
        id: "adhoc_" + U.slug(ai.name), name: ai.name, cat: "pratos", unit: "g",
        per100: { kcal: 0, protein: 0, carb: 0, fiber: 0, fat: 0, sat: null, sodium: null },
        gi: 0, giRange: [0, 0], conf: "baixa", portion: ai.estimatedGrams, household: [],
        note: "Alimento não encontrado no banco — informe os valores.", generic: false
      };
      var it = C.itemFromFood(food, ai.estimatedGrams);
      it.prep = ai.preparation || it.prep;
      it.conf = ai.confidence >= 0.8 ? "alta" : (ai.confidence >= 0.55 ? "media" : "baixa");
      it.rangeGrams = ai.rangeGrams || C.defaultRange(it.grams, it.conf);
      if (!match) it.needsData = true;
      m.items.push(it);
    });
    m.aiUncertainties = res.uncertainties;
    FL.openEditor(m, { isNew: true, title: "Confirmar refeição", previewPhoto: photo.dataUrl });
  }).catch(function (err) {
    UI.closeSheet();
    var wrap = el("div", { class: "stack" });
    wrap.appendChild(el("div", { class: "note warn", text: (err && err.message) || "A análise não pôde ser concluída." }));
    wrap.appendChild(el("button", {
      class: "btn btn-primary btn-block", text: "Preencher manualmente",
      onclick: function () {
        UI.closeSheet();
        FL.openEditor(D.newMeal({ source: "photo" }), { isNew: true, previewPhoto: photo.dataUrl });
      }
    }));
    UI.openSheet("Análise indisponível", wrap);
  });
};

FL.step = function (g) { return g >= 200 ? 20 : (g >= 50 ? 10 : 5); };

FL.setGrams = function (idx, grams) {
  var it = UI.editor.meal.items[idx];

  it.rangeGrams = C.defaultRange(it.grams, it.conf);
  FL.renderEditor();
};

FL.addItem = function () {

FL.saveEditor = U.once(function () {
  var st = UI.editor;
  if (!st) return;
  var m = st.meal;
  if (!m.items.length) return UI.toast("Adicione ao menos um alimento.");
  if (m.items.some(function (i) { return U.pos(i.grams) <= 0; })) return UI.toast("Há itens com quantidade zerada.");
  var dup = D.meals.filter(function (x) {
    return x.id !== m.id && x.date === m.date && x.time === m.time && x.mealType === m.mealType &&
      x.items.length === m.items.length && x.mode === m.mode;
  })[0];
  var proceed = function () {
    D.save(m).then(function () {
      FL.closeEditor();
      UI.toast(m.mode === "consumed" ? "Refeição registrada no diário." : "Consulta salva: fora dos totais do dia.");
      UI.refresh();
    }).catch(function (e) {
      console.error(e);
      UI.toast("Não foi possível salvar. Tente novamente.");
    });
  };
  if (dup && st.isNew) {
    UI.confirm({
      title: "Registro parecido", message: "Já existe uma refeição igual nesse horário. Deseja registrar mesmo assim?",
      confirmLabel: "Registrar assim mesmo"
    }).then(function (ok) { if (ok) proceed(); });
  } else proceed();
}, 900);

FL.editorExtras = function () {

        UI.toast("Refeição removida.", "Desfazer", function () { D.undoRemove().then(function () { UI.refresh(); }); });
